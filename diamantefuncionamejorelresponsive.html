<script>
    const tarjetas = document.querySelectorAll(".diamante-card");


const modal = document.getElementById("modal");

const imagenPrincipal = document.getElementById("imagenPrincipal");

const miniaturas = document.getElementById("miniaturas");

const nombreProducto = document.getElementById("nombreProducto");

const precioProducto = document.getElementById("precioProducto");

const descripcionProducto = document.getElementById("descripcionProducto");

const cerrar = document.querySelector(".cerrar");

const btnWhatsapp = document.getElementById("btnWhatsapp");



let productoSeleccionado = "";







/* ABRIR PRODUCTO */


tarjetas.forEach(card=>{


card.addEventListener("click",()=>{


crearParticulas();



productoSeleccionado =
card.dataset.nombre;



nombreProducto.textContent =
card.dataset.nombre;



precioProducto.textContent =
card.dataset.precio;



descripcionProducto.textContent =
card.dataset.descripcion;





let listaImagenes = 
card.dataset.imagenes
.split(",")
.map(img=>img.trim());





cargarGaleria(listaImagenes);




modal.classList.add("activo");



});



});









/* CARGAR IMAGEN PRINCIPAL Y MINIATURAS */


function cargarGaleria(imagenes){



miniaturas.innerHTML="";



imagenPrincipal.src =
imagenes[0];




imagenes.forEach((imagen,index)=>{



let mini = document.createElement("img");



mini.src = imagen;



mini.onclick = ()=>{


imagenPrincipal.src = imagen;



crearParticulas();


};



miniaturas.appendChild(mini);



});



}










/* CERRAR MODAL */


cerrar.onclick=()=>{


modal.classList.remove("activo");


};






modal.onclick=(e)=>{


if(e.target===modal){


modal.classList.remove("activo");


}



};









/* WHATSAPP */


btnWhatsapp.onclick=()=>{



let mensaje =

`Hola, me interesa la ${productoSeleccionado}. ¿Me puede dar información y precio?`;




window.open(

"https://wa.me/?text="+

encodeURIComponent(mensaje)

);



};









/* PARTICULAS HOLOGRAFICAS */


function crearParticulas(){



for(let i=0;i<40;i++){



let p=document.createElement("div");



p.className="particula";



p.style.left="50%";

p.style.top="50%";





let x =
(Math.random()*600)-300;



let y =
(Math.random()*600)-300;





p.style.setProperty(
"--x",
x+"px"
);



p.style.setProperty(
"--y",
y+"px"
);





document.body.appendChild(p);





setTimeout(()=>{


p.remove();



},1000);





}



}









/* ROTACION 3D SUAVE */





/* EFECTO ENTRADA HOLOGRAFICA */



window.onload=()=>{


document.querySelectorAll(".diamante-card")
.forEach((card,index)=>{


card.style.opacity="0";


setTimeout(()=>{


card.style.opacity="1";


},index*200);



});



};
let tarjetaCentro = document.querySelector(".principal");


let tarjetasOrbita = [
document.querySelector(".posicion1"),
document.querySelector(".posicion2"),
document.querySelector(".posicion3"),
document.querySelector(".posicion4"),
document.querySelector(".posicion5")
];


let angulo = 0;

let radio = 380;

if(window.innerWidth <= 1100){
    radio = 320;
}

if(window.innerWidth <= 800){
    radio = 280;
}

if(window.innerWidth <= 600){
    radio = 230;
}

if(window.innerWidth <= 380){
    radio = 190;
}

let velocidad = 0.035;

// Tablet
if (window.innerWidth <= 1100){
    velocidad = 0.022;
}

// Tablet vertical
if (window.innerWidth <= 800){
    velocidad = 0.014;
}

// Celular
if (window.innerWidth <= 600){
    velocidad = 0.009;
}

// Celular pequeño
if (window.innerWidth <= 380){
    velocidad = 0.007;
}
// GIRO DE LAS 5 TARJETAS
function girarTarjetas(){

    angulo += velocidad * (
        60 /
        (screen.orientation
            ? (screen.orientation.type.includes("landscape") ? 60 : 120)
            : 60)
    );

    tarjetasOrbita.forEach((tarjeta,index)=>{

        let a =
            angulo +
            (index * (Math.PI * 2 / tarjetasOrbita.length));

        let x =
            Math.cos(a) * radio;

        let y =
            Math.sin(a) * radio;

        // AJUSTE SOLO PARA RESPONSIVE
        if(window.innerWidth <= 1100){
            x *= 0.90;
            y *= 0.90;
        }

        if(window.innerWidth <= 800){
            x *= 0.82;
            y *= 0.82;
        }

        if(window.innerWidth <= 600){
            x *= 0.72;
            y *= 0.72;
        }

        if(window.innerWidth <= 380){
            x *= 0.65;
            y *= 0.65;
        }

        let profundidad =
            Math.sin(a);

        let escala =
            0.75 + ((profundidad + 1) / 2) * 0.25;

        tarjeta.style.transform = `
            translate(
                calc(-50% + ${x}px),
                calc(-50% + ${y}px)
            )
            scale(${escala})
        `;

        tarjeta.style.zIndex =
            100 + Math.floor(profundidad * 50);

    });

    requestAnimationFrame(girarTarjetas);

}

girarTarjetas();



// CAMBIO CUANDO UNA TARJETA PASA ARRIBA

setInterval(()=>{

    let nuevaCentral = tarjetasOrbita.shift();

    // LA DEL CENTRO SALE A LA ÓRBITA
    tarjetasOrbita.push(tarjetaCentro);

    // NUEVA TARJETA AL CENTRO
    nuevaCentral.style.transform = `
        translate(-50%,-50%)
        scale(1.2)
    `;

    // HACERLA GRANDE
    let diamanteNuevo =
        nuevaCentral.querySelector(".diamante");

    diamanteNuevo.classList.add("grande");

    tarjetaCentro.style.transform = `
        translate(
            calc(-50% + 0px),
            calc(-50% + 0px)
        )
        scale(1)
    `;

    // QUITAR TAMAÑO GRANDE AL ANTERIOR
    let diamanteAnterior =
        tarjetaCentro.querySelector(".diamante");

    diamanteAnterior.classList.remove("grande");

    tarjetaCentro.style.zIndex = 100;

    tarjetaCentro = nuevaCentral;

},5000);

const btnMenu = document.getElementById("btnMenu");
const menuHamburguesa = document.getElementById("menuHamburguesa");

btnMenu.addEventListener("click", () => {
    menuHamburguesa.classList.toggle("activo");
});
</script>

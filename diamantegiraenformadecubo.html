<title>6 tarjetas triangulares 3D</title>

<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            #ffffff 0%,
            #f4f7f8 52%,
            #d8e3e7 100%
        );

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   ESCENA 3D
========================================================= */

.escena-3d{
    position:relative;

    width:700px;
    height:700px;

    display:flex;
    align-items:center;
    justify-content:center;

    perspective:2000px;
    perspective-origin:center center;

    user-select:none;
}


/* =========================================================
   OBJETO COMPLETO

   ESTE OBJETO USA EL MISMO MOVIMIENTO DEL CUBO
========================================================= */

.objeto-3d{
    position:relative;

    width:320px;
    height:320px;

    transform-style:preserve-3d;
    transform-origin:center center;

    animation:
        giroCubo 10s
        cubic-bezier(.45,.05,.55,.95)
        infinite;

    will-change:transform;
}


/* =========================================================
   MOVIMIENTO EXACTO DEL CUBO
========================================================= */

@keyframes giroCubo{

    0%{
        transform:
            rotateX(0deg)
            rotateY(0deg);
    }

    50%{
        transform:
            rotateX(180deg)
            rotateY(180deg);
    }

    100%{
        transform:
            rotateX(360deg)
            rotateY(360deg);
    }

}


/* =========================================================
   CADA CARA DEL OBJETO

   LAS 6 CARAS USAN LA MISMA ESTRUCTURA DEL CUBO,
   PERO SU CONTENIDO TIENE FORMA TRIANGULAR
========================================================= */

.cara{
    position:absolute;

    left:50%;
    top:50%;

    width:320px;
    height:320px;

    margin-left:-160px;
    margin-top:-160px;

    display:flex;
    align-items:center;
    justify-content:center;

    transform-style:preserve-3d;

    cursor:pointer;

    backface-visibility:visible;

    transition:
        filter .3s ease,
        opacity .3s ease;
}


/* =========================================================
   POSICIÓN DE LAS 6 CARAS

   ESTAS SON LAS MISMAS POSICIONES DEL CUBO
========================================================= */

.cara-1{
    transform:
        rotateY(0deg)
        translateZ(160px);
}

.cara-2{
    transform:
        rotateY(90deg)
        translateZ(160px);
}

.cara-3{
    transform:
        rotateY(180deg)
        translateZ(160px);
}

.cara-4{
    transform:
        rotateY(-90deg)
        translateZ(160px);
}

.cara-5{
    transform:
        rotateX(90deg)
        translateZ(160px);
}

.cara-6{
    transform:
        rotateX(-90deg)
        translateZ(160px);
}


/* =========================================================
   TARJETA TRIANGULAR

   AQUÍ SE CONSERVA LA FORMA TRIANGULAR REDONDEADA
========================================================= */

.tarjeta-triangular{
    position:relative;

    width:310px;
    height:285px;

    filter:
        drop-shadow(
            0 18px 18px
            rgba(0,0,0,.28)
        );

    transition:
        transform .35s ease,
        filter .35s ease;
}

.tarjeta-triangular:hover{
    transform:
        scale(1.045);

    filter:
        drop-shadow(
            0 25px 25px
            rgba(0,0,0,.38)
        )
        brightness(1.08);
}

.tarjeta-triangular svg{
    width:100%;
    height:100%;

    display:block;

    overflow:visible;
}


/* =========================================================
   VIDEO DENTRO DE LA TARJETA TRIANGULAR
========================================================= */

.video-tarjeta{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    pointer-events:none;
}


/* =========================================================
   LUZ CENTRAL
========================================================= */

.centro-luz{
    position:absolute;

    left:50%;
    top:50%;

    width:210px;
    height:210px;

    transform:
        translate(-50%, -50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95) 0%,
            rgba(102,255,224,.38) 35%,
            rgba(178,112,255,.20) 58%,
            transparent 76%
        );

    filter:blur(18px);

    pointer-events:none;
}


/* =========================================================
   INDICACIÓN
========================================================= */

.indicacion{
    position:absolute;

    left:50%;
    bottom:24px;

    transform:
        translateX(-50%);

    padding:
        10px 18px;

    color:#222222;

    background:
        rgba(255,255,255,.88);

    border:
        1px solid
        rgba(0,0,0,.08);

    border-radius:30px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.12);

    font-size:14px;
    font-weight:700;

    white-space:nowrap;

    backdrop-filter:
        blur(8px);
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;

    inset:0;

    z-index:999999;

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.88);

    backdrop-filter:
        blur(8px);
}

.modal.activo{
    display:flex;
}


/* =========================================================
   CAJA DEL MODAL
========================================================= */

.modal-caja{
    position:relative;

    width:
        min(1050px, 96vw);

    max-height:92vh;

    display:grid;

    grid-template-columns:
        1.15fr .85fr;

    overflow:auto;

    background:#ffffff;

    border-radius:22px;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.58);
}


/* =========================================================
   BOTÓN CERRAR
========================================================= */

.cerrar-modal{
    position:absolute;

    top:12px;
    right:12px;

    z-index:50;

    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    border-radius:50%;

    color:#ffffff;
    background:#111111;

    font-size:28px;

    cursor:pointer;
}


/* =========================================================
   GALERÍA DEL MODAL
========================================================= */

.modal-galeria{
    padding:25px;

    background:#101010;
}

.visual-principal{
    width:100%;
    height:500px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#050505;

    border-radius:16px;
}


/* =========================================================
   IMAGEN O VIDEO PRINCIPAL

   SE MUESTRA COMPLETO, SIN DEFORMARSE
========================================================= */

.visual-principal img,
.visual-principal video{
    width:100%;
    height:100%;

    display:block;

    object-fit:contain;
}


/* =========================================================
   MINIATURAS
========================================================= */

.miniaturas{
    display:flex;

    gap:12px;

    margin-top:16px;

    overflow-x:auto;
}

.miniatura{
    position:relative;

    flex:
        0 0 88px;

    width:88px;
    height:72px;

    overflow:hidden;

    border:
        3px solid
        transparent;

    border-radius:10px;

    background:#222222;

    cursor:pointer;
}

.miniatura.activa{
    border-color:#62ffc8;
}

.miniatura img,
.miniatura video{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    pointer-events:none;
}

.icono-video{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%, -50%);

    color:#ffffff;

    font-size:25px;

    text-shadow:
        0 2px 8px
        #000000;
}


/* =========================================================
   INFORMACIÓN DEL MODAL
========================================================= */

.modal-informacion{
    padding:
        70px 38px 38px;

    display:flex;
    flex-direction:column;
}

.modal-informacion h2{
    margin-bottom:18px;

    color:#151515;

    font-size:30px;
}

.modal-informacion p{
    margin-bottom:18px;

    color:#4b4b4b;

    font-size:17px;
    line-height:1.65;
}

.precio-modal{
    margin:
        8px 0 25px;

    color:#111111;

    font-size:28px;
    font-weight:800;
}


/* =========================================================
   BOTÓN WHATSAPP
========================================================= */

.boton-whatsapp{
    width:100%;

    margin-top:auto;

    padding:
        16px 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ffffff;

    background:#25d366;

    border-radius:12px;

    font-size:18px;
    font-weight:800;

    text-align:center;
    text-decoration:none;

    transition:
        transform .25s ease,
        background .25s ease;
}

.boton-whatsapp:hover{
    background:#1ebe5d;

    transform:
        translateY(-3px);
}


/* =========================================================
   RESPONSIVE TABLETA
========================================================= */

@media(max-width:850px){

    .escena-3d{
        width:100vw;
        height:100vh;

        transform:
            scale(.78);
    }

    .modal-caja{
        grid-template-columns:
            1fr;
    }

    .visual-principal{
        height:390px;
    }

    .modal-informacion{
        padding:
            32px 26px;
    }

}


/* =========================================================
   RESPONSIVE CELULAR
========================================================= */

@media(max-width:560px){

    .escena-3d{
        transform:
            scale(.58);
    }

    .indicacion{
        bottom:-30px;

        font-size:13px;
    }

}


@media(max-width:520px){

    .modal{
        padding:8px;
    }

    .modal-caja{
        width:100%;

        max-height:97vh;

        border-radius:15px;
    }

    .modal-galeria{
        padding:14px;
    }

    .visual-principal{
        height:310px;
    }

    .modal-informacion h2{
        font-size:24px;
    }

}

</style>

/* =========================================================

========================================================= */

const objeto3D =
    document.getElementById("objeto3D");

const modal =
    document.getElementById("modal");

const cerrarModal =
    document.getElementById("cerrarModal");

const visualPrincipal =
    document.getElementById("visualPrincipal");

const miniaturas =
    document.getElementById("miniaturas");

const tituloModal =
    document.getElementById("tituloModal");

const descripcionModal =
    document.getElementById("descripcionModal");

const precioModal =
    document.getElementById("precioModal");

const botonWhatsApp =
    document.getElementById("botonWhatsApp");


/* =========================================================
   CREAR IMAGEN O VIDEO
========================================================= */

function crearMedio(
    elemento,
    esMiniatura = false
){

    if(elemento.tipo === "video"){

        const video =
            document.createElement("video");

        video.src =
            elemento.archivo;

        video.playsInline =
            true;

        video.preload =
            "metadata";

        if(esMiniatura){

            video.muted =
                true;

        }else{

            video.controls =
                true;

        }

        return video;
    }


    const imagen =
        document.createElement("img");

    imagen.src =
        elemento.archivo;

    imagen.alt =
        "Imagen del producto";

    return imagen;
}


/* =========================================================
   MOSTRAR IMAGEN O VIDEO PRINCIPAL
========================================================= */

function mostrarPrincipal(elemento){

    visualPrincipal.innerHTML =
        "";

    const medio =
        crearMedio(
            elemento,
            false
        );

    visualPrincipal.appendChild(
        medio
    );

    if(elemento.tipo === "video"){

        medio.play().catch(() => {});
    }
}


/* =========================================================
   ABRIR MODAL
========================================================= */

function abrirModal(indice){

    const producto =
        productos[indice];

    tituloModal.textContent =
        producto.nombre;

    descripcionModal.textContent =
        producto.descripcion;

    precioModal.textContent =
        producto.precio;


    const mensaje =
        encodeURIComponent(

            `Hola. Me interesa recibir más información sobre ${producto.nombre}. ¿Podría compartir los detalles, disponibilidad y proceso de compra, por favor?`

        );


    botonWhatsApp.href =
        `https://wa.me/523344340062?text=${mensaje}`;


    miniaturas.innerHTML =
        "";


    mostrarPrincipal(
        producto.galeria[0]
    );


    producto.galeria.forEach(

        (elemento, posicion) => {


            const boton =
                document.createElement("button");

            boton.type =
                "button";

            boton.className =
                "miniatura";


            if(posicion === 0){

                boton.classList.add(
                    "activa"
                );
            }


            const medio =
                crearMedio(
                    elemento,
                    true
                );

            boton.appendChild(
                medio
            );


            if(elemento.tipo === "video"){

                const icono =
                    document.createElement("span");

                icono.className =
                    "icono-video";

                icono.textContent =
                    "▶";

                boton.appendChild(
                    icono
                );
            }


            boton.addEventListener(

                "click",

                () => {


                    document
                        .querySelectorAll(".miniatura")
                        .forEach(item => {

                            item.classList.remove(
                                "activa"
                            );
                        });


                    boton.classList.add(
                        "activa"
                    );


                    mostrarPrincipal(
                        elemento
                    );
                }
            );


            miniaturas.appendChild(
                boton
            );
        }
    );


    modal.classList.add(
        "activo"
    );


    document.body.style.overflow =
        "hidden";


    objeto3D.style.animationPlayState =
        "paused";
}


/* =========================================================
   ABRIR CADA TARJETA
========================================================= */

document
    .querySelectorAll(".tarjeta-triangular")
    .forEach(tarjeta => {


        tarjeta.addEventListener(

            "click",

            evento => {


                evento.stopPropagation();


                const indice =
                    Number(
                        tarjeta.dataset.producto
                    );


                abrirModal(
                    indice
                );
            }
        );
    });


/* =========================================================
   CERRAR MODAL
========================================================= */

function cerrarVentana(){

    modal.classList.remove(
        "activo"
    );


    visualPrincipal.innerHTML =
        "";


    document.body.style.overflow =
        "";


    objeto3D.style.animationPlayState =
        "running";
}


cerrarModal.addEventListener(

    "click",

    cerrarVentana
);


modal.addEventListener(

    "click",

    evento => {


        if(evento.target === modal){

            cerrarVentana();
        }
    }
);


document.addEventListener(

    "keydown",

    evento => {


        if(evento.key === "Escape"){

            cerrarVentana();
        }
    }
);

</script>

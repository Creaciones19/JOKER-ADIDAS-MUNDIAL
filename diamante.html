<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Colección Diamante</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

background:
radial-gradient(circle,#5b0080,#080008);

display:flex;
justify-content:center;
align-items:center;

font-family:Arial;

perspective:1200px;

overflow:hidden;

}



/* CONTENEDOR */

.collection{

display:flex;

gap:60px;

flex-wrap:wrap;

justify-content:center;

width:90%;

}



/* DIAMANTE */

.diamond-card{

width:170px;
height:170px;

transform:rotate(45deg);

border-radius:25px;

padding:7px;


background:
linear-gradient(
145deg,
#ffffff,
#ff00ff,
#6500ff
);


box-shadow:

0 0 30px #ff00ff,
0 0 70px #8000ff;


cursor:pointer;

transition:.5s;


animation:float 3s infinite ease-in-out;

}



.diamond-inner{

width:100%;
height:100%;

overflow:hidden;

border-radius:20px;

background:black;

}




.diamond-inner img{

width:145%;
height:145%;

object-fit:cover;


transform:

rotate(-45deg)
translate(-15%,-15%);

}





.diamond-card:hover{


transform:

rotate(45deg)
scale(1.15);


box-shadow:

0 0 70px #ff00ff,
0 0 150px #b000ff;


}




@keyframes float{


50%{

margin-top:-20px;

}

}




/* MODAL */


.modal{

position:fixed;

inset:0;

background:rgba(0,0,0,.85);

display:flex;

justify-content:center;

align-items:center;


opacity:0;

pointer-events:none;

transition:.4s;

}



.modal.active{

opacity:1;

pointer-events:auto;

}




.modal-box{

background:#111;

padding:35px;

border-radius:30px;

text-align:center;

color:white;


box-shadow:

0 0 60px #ff00ff;


}





/* DIAMANTE GRANDE DEL MODAL */


.modal-diamond{


width:260px;

height:260px;


margin:auto;


transform:rotate(45deg);


overflow:hidden;


border-radius:30px;


padding:8px;


background:

linear-gradient(
145deg,
#ffffff,
#ff00ff,
#6500ff
);



box-shadow:

0 0 40px #ff00ff,
0 0 100px #8000ff;



}




.modal-diamond img{


width:100%;

height:100%;


object-fit:cover;


border-radius:25px;


transform:

rotate(-45deg)
scale(1.4);


}






.modal-box h2{


margin-top:35px;


color:#ff4cff;


font-size:28px;


}





.modal-box p{


margin-top:15px;


line-height:1.5;


color:#ddd;


max-width:350px;


}





button{


margin-top:25px;


padding:12px 35px;


border:none;


border-radius:25px;


background:#ff00ff;


color:white;


font-size:16px;


cursor:pointer;


}



</style>

</head>



<body>



<div class="collection">



<div class="diamond-card"
data-titulo="Chamarra Adidas Premium"
data-texto="Chamarra deportiva con diseño moderno, tela resistente al viento, cierre frontal y acabado premium. Ideal para uso casual y deportivo.">

<div class="diamond-inner">
<img src="chamarra1 (1).png">
</div>

</div>





<div class="diamond-card"
data-titulo="Chamarra Urbana Negra"
data-texto="Modelo urbano elegante, cómoda para uso diario y perfecta para combinar con diferentes estilos.">

<div class="diamond-inner">
<img src="chamarra1 (2).png">
</div>

</div>





<div class="diamond-card"
data-titulo="Chamarra Deportiva Azul"
data-texto="Diseño deportivo ligero, cómoda y resistente para actividades diarias.">

<div class="diamond-inner">
<img src="chamarra1 (3).png">
</div>

</div>





<div class="diamond-card"
data-titulo="Chamarra Moderna"
data-texto="Modelo moderno con acabado premium y gran comodidad.">

<div class="diamond-inner">
<img src="chamarra1 (4).png">
</div>

</div>





<div class="diamond-card"
data-titulo="Chamarra Casual"
data-texto="Estilo casual para cualquier ocasión, diseño cómodo y elegante.">

<div class="diamond-inner">
<img src="chamarra1 (5).png">
</div>

</div>





<div class="diamond-card"
data-titulo="Chamarra Exclusiva"
data-texto="Edición especial con diseño exclusivo y materiales de alta calidad.">

<div class="diamond-inner">
<img src="chamarra1 (6).png">
</div>

</div>



</div>







<!-- MODAL -->

<div class="modal" id="modal">


<div class="modal-box">



<div class="modal-diamond">

<img id="modalImg">

</div>



<h2 id="modalTitulo"></h2>


<p id="modalTexto"></p>



<button onclick="cerrar()">
Cerrar
</button>



</div>


</div>







<script>


const cards=document.querySelectorAll(".diamond-card");


const modal=document.getElementById("modal");


const modalImg=document.getElementById("modalImg");


const modalTitulo=document.getElementById("modalTitulo");


const modalTexto=document.getElementById("modalTexto");





cards.forEach(card=>{


card.onclick=()=>{


let img=
card.querySelector("img").src;



modalImg.src=img;



modalTitulo.textContent=
card.dataset.titulo;



modalTexto.textContent=
card.dataset.texto;



modal.classList.add("active");



};



});





function cerrar(){

modal.classList.remove("active");

}





modal.onclick=(e)=>{


if(e.target===modal){

cerrar();

}


}



</script>



</body>
</html>

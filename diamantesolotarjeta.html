<title>6 tarjetas triangulares con modal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    font-family:Arial, sans-serif;

    color:#fff;

    overflow-x:hidden;

    background:
    radial-gradient(circle at top,#4c0078 0%,#180024 28%,#090014 55%,#020202 100%);

    position:relative;

}


/* Fondo animado */

body::before{

    content:"";

    position:fixed;
    inset:0;

    background:

    radial-gradient(circle,#8f5cff55 2px,transparent 2px),
    radial-gradient(circle,#66ffd555 1.5px,transparent 1.5px);

    background-size:170px 170px,120px 120px;

    animation:fondoMover 22s linear infinite;

    opacity:.55;

    pointer-events:none;

    z-index:-2;

}


/* Halo central */
/* BRILLOS PEQUEÑOS COMO ESTRELLAS PARPADEANDO */

body::after{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:-1;

    background-image:

        radial-gradient(circle at 8% 18%, rgba(255,255,255,.95) 0 2px, transparent 3px),
        radial-gradient(circle at 18% 72%, rgba(110,255,216,.90) 0 2px, transparent 3px),
        radial-gradient(circle at 28% 35%, rgba(255,255,255,.85) 0 1.5px, transparent 3px),
        radial-gradient(circle at 42% 82%, rgba(156,121,255,.95) 0 2px, transparent 4px),
        radial-gradient(circle at 54% 22%, rgba(255,255,255,.90) 0 2px, transparent 3px),
        radial-gradient(circle at 67% 65%, rgba(110,255,216,.85) 0 1.5px, transparent 3px),
        radial-gradient(circle at 76% 30%, rgba(255,255,255,.95) 0 2px, transparent 4px),
        radial-gradient(circle at 88% 78%, rgba(156,121,255,.90) 0 2px, transparent 3px),
        radial-gradient(circle at 94% 14%, rgba(255,255,255,.85) 0 1.5px, transparent 3px),

        radial-gradient(circle at 12% 48%, rgba(255,255,255,.70) 0 1px, transparent 2px),
        radial-gradient(circle at 35% 12%, rgba(110,255,216,.75) 0 1px, transparent 2px),
        radial-gradient(circle at 48% 55%, rgba(255,255,255,.75) 0 1px, transparent 2px),
        radial-gradient(circle at 63% 88%, rgba(156,121,255,.75) 0 1px, transparent 2px),
        radial-gradient(circle at 82% 52%, rgba(255,255,255,.75) 0 1px, transparent 2px);

    animation:
        parpadeoEstrellas 3.8s ease-in-out infinite alternate,
        moverEstrellas 18s linear infinite;

    filter:
        drop-shadow(0 0 5px rgba(255,255,255,.65))
        drop-shadow(0 0 10px rgba(140,90,255,.35));

}


@keyframes parpadeoEstrellas{

    0%{
        opacity:.22;
    }

    25%{
        opacity:.75;
    }

    50%{
        opacity:.38;
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:.48;
    }

}


@keyframes moverEstrellas{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-18px);
    }

}
/* ==================================================
   CONTENEDOR DE LAS 6 TARJETAS
================================================== */

.contenedor-tarjetas{
    width:100%;
    max-width:1400px;
    margin:auto;
    padding:50px 25px;

    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:45px;

    justify-items:center;
    align-items:center;
}


/* ==================================================
   TARJETAS TRIANGULARES
================================================== */

.tarjeta-triangular{
    width:100%;
    max-width:380px;

    cursor:pointer;

    filter:
        drop-shadow(0 20px 25px rgba(0,0,0,.25));

    transition:
        transform .4s ease,
        filter .4s ease;
}

.tarjeta-triangular:hover{
    transform:translateY(-12px) scale(1.04);

    filter:
        drop-shadow(0 28px 30px rgba(0,0,0,.32));
}

.tarjeta-triangular svg{
    width:100%;
    height:auto;
    display:block;
}


/* VIDEO DENTRO DE LA TARJETA TRIANGULAR */

.video-tarjeta{
    width:100%;
    height:100%;

    display:block;
    object-fit:cover;

    pointer-events:none;
}


/* ==================================================
   TABLETA
================================================== */

@media(max-width:950px){

    .contenedor-tarjetas{
        grid-template-columns:repeat(2, 1fr);
        gap:35px;
    }

}


/* ==================================================
   CELULAR
================================================== */

@media(max-width:600px){

    .contenedor-tarjetas{
        grid-template-columns:1fr;
        padding:30px 15px;
        gap:30px;
    }

    .tarjeta-triangular{
        max-width:360px;
    }

}


/* ==================================================
   MODAL
================================================== */

.modal{
    position:fixed;
    inset:0;

    z-index:99999;

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.86);
}

.modal.activo{
    display:flex;
}


/* CAJA DEL MODAL */

.modal-caja{
    position:relative;

    width:min(1050px, 96vw);
    max-height:92vh;

    display:grid;
    grid-template-columns:1.15fr .85fr;

    overflow:auto;

    background:#ffffff;

    border-radius:22px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.55);
}


/* BOTÓN CERRAR */

.cerrar-modal{
    position:absolute;

    top:12px;
    right:12px;

    z-index:30;

    width:44px;
    height:44px;

    border:0;
    border-radius:50%;

    color:#ffffff;
    background:#111111;

    font-size:28px;

    cursor:pointer;
}


/* ==================================================
   GALERÍA DEL MODAL
================================================== */

.modal-galeria{
    padding:25px;

    background:#101010;
}


/* IMAGEN O VIDEO PRINCIPAL */

.visual-principal{
    width:100%;
    height:500px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#050505;

    border-radius:16px;
}


/* EN EL MODAL SE MUESTRA COMPLETO */

.visual-principal img,
.visual-principal video{
    width:100%;
    height:100%;

    display:block;

    object-fit:contain;
}


/* MINIATURAS */

.miniaturas{
    display:flex;
    gap:12px;

    margin-top:16px;

    overflow-x:auto;
}

.miniatura{
    position:relative;

    flex:0 0 88px;

    width:88px;
    height:72px;

    overflow:hidden;

    border:3px solid transparent;
    border-radius:10px;

    background:#222222;

    cursor:pointer;
}

.miniatura.activa{
    border-color:#62ffc8;
}

.miniatura img,
.miniatura video{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    pointer-events:none;
}

.icono-video{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%, -50%);

    color:#ffffff;

    font-size:25px;

    text-shadow:
        0 2px 8px #000000;
}


/* ==================================================
   INFORMACIÓN DEL MODAL
================================================== */

.modal-informacion{
    padding:70px 38px 38px;

    display:flex;
    flex-direction:column;
}

.modal-informacion h2{
    margin-bottom:18px;

    color:#151515;

    font-size:30px;
}

.modal-informacion p{
    margin-bottom:18px;

    color:#4b4b4b;

    font-size:17px;
    line-height:1.65;
}

.precio-modal{
    margin:8px 0 25px;

    color:#111111;

    font-size:28px;
    font-weight:800;
}


/* ==================================================
   BOTÓN WHATSAPP
================================================== */

.boton-whatsapp{
    width:100%;

    margin-top:auto;
    padding:16px 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ffffff;
    background:#25d366;

    border-radius:12px;

    font-size:18px;
    font-weight:800;

    text-align:center;
    text-decoration:none;

    transition:
        transform .25s ease,
        background .25s ease;
}

.boton-whatsapp:hover{
    background:#1ebe5d;

    transform:translateY(-3px);
}


/* ==================================================
   MODAL RESPONSIVE
================================================== */

@media(max-width:850px){

    .modal-caja{
        grid-template-columns:1fr;
    }

    .visual-principal{

    .modal-informacion{

    .modal-informacion h2{

/* ==========================================================

========================================================== */

const modal =
    document.getElementById("modal");

const cerrarModal =

const visualPrincipal =
    document.getElementById("visualPrincipal");

const miniaturas =
    document.getElementById("miniaturas");

const tituloModal =
    document.getElementById("tituloModal");

const descripcionModal =
    document.getElementById("descripcionModal");

const precioModal =
    document.getElementById("precioModal");

const botonWhatsApp =
    document.getElementById("botonWhatsApp");


/* ==========================================================
   CREAR IMAGEN O VIDEO
========================================================== */

function crearMedio(elemento, esMiniatura = false){


    if(elemento.tipo === "video"){

        const video =
            document.createElement("video");


        video.src =
            elemento.archivo;

        video.playsInline =
            true;

        video.preload =
            "metadata";


        if(esMiniatura){

            video.muted =
                true;

        }else{

            video.controls =
                true;

        }


        return video;

    }


    const imagen =
        document.createElement("img");


    imagen.src =
        elemento.archivo;

    imagen.alt =
        "Imagen del producto";


    return imagen;

}


/* ==========================================================
   MOSTRAR IMAGEN O VIDEO PRINCIPAL
========================================================== */

function mostrarPrincipal(elemento){


    visualPrincipal.innerHTML =
        "";


    const medio =
        crearMedio(elemento, false);


    visualPrincipal.appendChild(medio);

}


/* ==========================================================
   ABRIR MODAL
========================================================== */

function abrirModal(indice){


    const producto =
        productos[indice];


    tituloModal.textContent =
        producto.nombre;


    descripcionModal.textContent =
        producto.descripcion;


    precioModal.textContent =
        producto.precio;


    const mensaje =
        encodeURIComponent(

            `Hola. Me interesa recibir más información sobre ${producto.nombre}. ¿Podría compartir los detalles, disponibilidad y proceso de compra, por favor?`

        );


    botonWhatsApp.href =
        `https://wa.me/523344340062?text=${mensaje}`;


    miniaturas.innerHTML =
        "";


    mostrarPrincipal(
        producto.galeria[0]
    );


    producto.galeria.forEach(

        (elemento, posicion) => {


            const boton =
                document.createElement("button");


            boton.type =
                "button";


            boton.className =
                "miniatura";


            if(posicion === 0){

                boton.classList.add(
                    "activa"
                );

            }


            const medio =
                crearMedio(
                    elemento,
                    true
                );


            boton.appendChild(medio);


            if(elemento.tipo === "video"){


                const icono =
                    document.createElement("span");


                icono.className =
                    "icono-video";


                icono.textContent =
                    "▶";


                boton.appendChild(icono);

            }


            boton.addEventListener(

                "click",

                () => {


                    document
                        .querySelectorAll(".miniatura")
                        .forEach(item => {


                            item.classList.remove(
                                "activa"
                            );


                        });


                    boton.classList.add(
                        "activa"
                    );


                    mostrarPrincipal(
                        elemento
                    );

                }

            );


            miniaturas.appendChild(
                boton
            );

        }

    );


    modal.classList.add(
        "activo"
    );


    document.body.style.overflow =
        "hidden";

}


/* ==========================================================
   CERRAR MODAL
========================================================== */

function cerrarVentana(){


    modal.classList.remove(
        "activo"
    );


    visualPrincipal.innerHTML =
        "";


    document.body.style.overflow =
        "";

}


/* ==========================================================
   ABRIR CADA TARJETA
========================================================== */

document
    .querySelectorAll(".tarjeta-triangular")
    .forEach(tarjeta => {


        tarjeta.addEventListener(

            "click",

            () => {


                const indice =
                    Number(
                        tarjeta.dataset.producto
                    );


                abrirModal(indice);

            }

        );

    });


/* BOTÓN CERRAR */

cerrarModal.addEventListener(

    "click",

    cerrarVentana

);


/* CERRAR AL TOCAR EL FONDO */

modal.addEventListener(

    "click",

    event => {


        if(event.target === modal){

            cerrarVentana();

        }

    }

);


/* CERRAR CON ESCAPE */

document.addEventListener(

    "keydown",

    event => {


        if(event.key === "Escape"){

            cerrarVentana();

        }

    }

);

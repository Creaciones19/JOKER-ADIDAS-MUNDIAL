
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Vitrina Holográfica Premium</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --escala-vitrina:1;
    --alto-header:60px;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    min-height:100dvh;

    background:
    radial-gradient(
        circle at center,
        #5b008f 0%,
        #120018 45%,
        #000 100%
    );

    font-family:Arial,sans-serif;
    overflow:hidden;
    color:white;
    perspective:1200px;
}


/* ================================================= */
/* HEADER */
/* ================================================= */

.top-header{
    min-height:var(--alto-header);

    background:#111;

    padding:10px 20px;

    position:fixed;

    top:0;
    left:0;

    width:100%;

    z-index:99999;

    box-shadow:0 2px 10px rgba(0,0,0,.3);

    display:flex;

    align-items:center;
    justify-content:center;
}


/* BOTÓN HAMBURGUESA */

.menu-btn{
    position:absolute;

    left:20px;

    background:none;

    border:none;

    color:white;

    font-size:32px;

    cursor:pointer;

    line-height:1;
}


/* MENÚ DE COMPUTADORA */

.menu-categorias{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:8px;
}

.menu-categorias a{
    color:white;

    text-decoration:none;

    padding:8px 14px;

    font-size:14px;

    font-weight:bold;

    border-radius:8px;

    transition:.3s;

    white-space:nowrap;
}

.menu-categorias a:hover{
    background:white;
    color:black;
}


/* MENÚ HAMBURGUESA */

.menu-hamburguesa{
    display:none;

    position:fixed;

    top:var(--alto-header);

    left:0;

    width:min(280px,85vw);

    background:#111;

    flex-direction:column;

    padding:10px 0;

    z-index:99999;

    box-shadow:0 12px 30px rgba(0,0,0,.45);
}

.menu-hamburguesa.activo{
    display:flex;
}

.menu-hamburguesa a{
    color:white;

    text-decoration:none;

    padding:14px;

    text-align:center;

    border-bottom:1px solid #333;
}

.menu-hamburguesa a:hover{
    background:#222;
}


/* ================================================= */
/* ESCENA */
/* ================================================= */

.escena{
    position:fixed;

    top:var(--alto-header);

    left:0;
    right:0;
    bottom:0;

    overflow:hidden;
}


/* TÍTULO */

.titulo{
    position:absolute;

    top:12px;

    left:50%;

    transform:translateX(-50%);

    width:100%;

    padding:0 15px;

    text-align:center;

    font-size:clamp(17px,3vw,35px);

    letter-spacing:clamp(2px,.55vw,5px);

    color:#ff7cff;

    text-shadow:
    0 0 20px #ff00ff,
    0 0 50px #8a00ff;

    z-index:5;

    pointer-events:none;
}


/*
La vitrina conserva las mismas proporciones
de computadora.

En celulares y tabletas se reduce completa,
incluyendo tarjetas y distancias.
*/

.diamante-container{
    position:absolute;

    width:1000px;
    height:1000px;

    left:50%;
    top:52%;

    transform:
    translate(-50%,-50%)
    scale(var(--escala-vitrina));

    transform-origin:center center;

    transform-style:preserve-3d;
}


/* ================================================= */
/* TARJETAS */
/* ================================================= */

.diamante-card{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    cursor:pointer;

    will-change:transform;

    transition:opacity .45s ease;
}

.principal{
    z-index:300;
}


/* DIAMANTE */

.diamante{
    width:230px;
    height:230px;

    transform:rotate(45deg);

    padding:10px;

    border-radius:45px;

    background:
    linear-gradient(
        135deg,
        #ffffff,
        #ff00ff,
        #6500ff,
        #00ffff,
        #ffffff
    );

    box-shadow:
    0 0 30px #ff00ff,
    0 0 80px #7200ff,
    0 0 150px #00ffff;

    position:relative;

    overflow:hidden;

    transition:
    width .55s ease,
    height .55s ease,
    filter .35s ease;
}


/* DIAMANTE CENTRAL */

.diamante.grande{
    width:330px;
    height:330px;

    box-shadow:
    0 0 50px #ff00ff,
    0 0 130px #7200ff,
    0 0 200px #00ffff;
}


/* EFECTO AL PASAR EL CURSOR */

.diamante-card:not(.principal):hover .diamante{
    filter:brightness(1.18);
}


/* INTERIOR */

.diamante-interior{
    width:100%;
    height:100%;

    background:
    radial-gradient(
        circle,
        #240024,
        #000
    );

    border-radius:35px;

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;
}


/* IMAGEN DEL PRODUCTO */

.diamante-interior img{
    width:150%;
    height:150%;

    object-fit:contain;

    transform:rotate(-45deg);

    filter:
    drop-shadow(
        0 0 30px #ff00ff
    );

    transition:.6s;
}


/* REFLEJO */

.diamante::after{
    content:"";

    position:absolute;

    width:50px;
    height:400px;

    background:white;

    opacity:.35;

    top:-100px;
    left:-100px;

    transform:rotate(35deg);

    animation:reflejo 3s infinite;
}

@keyframes reflejo{

    from{
        left:-200px;
    }

    to{
        left:400px;
    }

}


/* ================================================= */
/* MODAL */
/* ================================================= */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.88);

    display:flex;

    align-items:center;
    justify-content:center;

    opacity:0;

    pointer-events:none;

    transition:.35s;

    z-index:100000;

    padding:18px;

    overflow:auto;
}

.modal.activo{
    opacity:1;
    pointer-events:auto;
}


.modal-contenido{
    position:relative;

    background:
    linear-gradient(
        145deg,
        #120012,
        #320040
    );

    padding:38px 30px 30px;

    border-radius:35px;

    width:min(500px,100%);

    text-align:center;

    box-shadow:
    0 0 80px #ff00ff;

    animation:entradaModal .55s;
}


@keyframes entradaModal{

    from{
        transform:
        scale(.3)
        rotateY(160deg);

        opacity:0;
    }

    to{
        transform:
        scale(1)
        rotateY(0);

        opacity:1;
    }

}


/* BOTÓN CERRAR */

.cerrar{
    position:absolute;

    top:12px;
    right:18px;

    background:none;

    border:none;

    color:white;

    font-size:30px;

    cursor:pointer;

    z-index:2;
}


/* DIAMANTE DEL MODAL */

.diamante-modal{
    width:300px;
    height:300px;

    margin:5px auto 0;

    transform:rotate(45deg);

    border-radius:40px;

    overflow:hidden;

    padding:10px;

    background:
    linear-gradient(
        135deg,
        white,
        #ff00ff,
        #7200ff
    );

    box-shadow:
    0 0 60px #ff00ff;
}

.diamante-modal img{
    width:150%;
    height:150%;

    object-fit:contain;

    transform:rotate(-45deg);
}


/* MINIATURAS */

.miniaturas{
    display:flex;

    justify-content:center;

    gap:10px;

    margin-top:40px;

    flex-wrap:wrap;
}

.miniaturas img{
    width:55px;
    height:55px;

    object-fit:contain;

    border-radius:10px;

    background:#000;

    padding:5px;

    cursor:pointer;

    box-shadow:
    0 0 15px #ff00ff;

    transition:.3s;
}

.miniaturas img:hover{
    transform:scale(1.15);
}


/* INFORMACIÓN */

#nombreProducto{
    margin-top:35px;

    font-size:28px;

    color:#ff7cff;
}

#precioProducto{
    color:#00ffff;

    font-size:25px;

    margin-top:10px;
}

#descripcionProducto{
    margin-top:15px;

    color:#ddd;

    line-height:1.5;
}


/* WHATSAPP */

.whatsapp{
    margin-top:25px;

    padding:15px 35px;

    border:none;

    border-radius:30px;

    background:#25D366;

    color:white;

    font-size:18px;

    cursor:pointer;

    box-shadow:
    0 0 30px #25D366;
}


/* ================================================= */
/* PARTÍCULAS */
/* ================================================= */

.particula{
    position:fixed;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#ff00ff;

    box-shadow:
    0 0 20px #ff00ff;

    pointer-events:none;

    animation:explosion 1s forwards;

    z-index:100001;
}

@keyframes explosion{

    to{
        transform:
        translate(
            var(--x),
            var(--y)
        )
        scale(0);

        opacity:0;
    }

}


/* ================================================= */
/* RESPONSIVO */
/* ================================================= */

@media(max-width:768px){

    .menu-categorias{
        display:none;
    }

    .menu-btn{
        font-size:30px;
    }

    .titulo{
        top:10px;
    }

}


@media(max-width:600px){

    :root{
        --alto-header:56px;
    }

    .top-header{
        min-height:56px;
    }

    .menu-btn{
        left:15px;
    }

    .diamante-container{
        top:53%;
    }

    .modal{
        align-items:flex-start;

        padding-top:72px;
    }

    .modal-contenido{
        padding:38px 16px 24px;

        border-radius:24px;
    }

    .diamante-modal{
        width:190px;
        height:190px;

        border-radius:30px;
    }

    .miniaturas{
        margin-top:28px;

        gap:7px;
    }

    .miniaturas img{
        width:44px;
        height:44px;
    }

    #nombreProducto{
        font-size:22px;

        margin-top:28px;
    }

    #precioProducto{
        font-size:20px;
    }

    .whatsapp{
        width:100%;

        font-size:16px;
    }

}


@media(max-height:650px) and (orientation:landscape){

    .titulo{
        font-size:18px;

        top:5px;
    }

    .diamante-container{
        top:55%;
    }

}

</style>
</head>

<script>

/* ================================================= */
/* ELEMENTOS */
/* ================================================= */

const tarjetas =
[
    ...document.querySelectorAll(
        ".diamante-card"
    )
];

const modal =
document.getElementById("modal");

const imagenPrincipal =
document.getElementById("imagenPrincipal");

const miniaturas =
document.getElementById("miniaturas");

const nombreProducto =
document.getElementById("nombreProducto");

const precioProducto =
document.getElementById("precioProducto");

const descripcionProducto =
document.getElementById(
    "descripcionProducto"
);

const cerrar =
document.querySelector(".cerrar");

const btnWhatsapp =
document.getElementById(
    "btnWhatsapp"
);

const btnMenu =
document.getElementById("btnMenu");

const menuHamburguesa =
document.getElementById(
    "menuHamburguesa"
);



/* ================================================= */
/* VARIABLES */
/* ================================================= */

let productoSeleccionado = "";

let tarjetaCentro =
document.querySelector(".principal");

let tarjetasOrbita =
tarjetas.filter(
    tarjeta =>
    tarjeta !== tarjetaCentro
);

let angulo = -Math.PI / 2;

let ultimoTiempo =
performance.now();

let modalAbierto = false;



/* ================================================= */
/* MEDIDAS DE LA VITRINA */
/* ================================================= */

/*
Estas medidas siempre permanecen iguales.

En celular no se reduce la distancia entre
las tarjetas.

Se reduce toda la vitrina completa.
*/

const ANCHO_ESCENARIO = 1000;

const ALTO_ESCENARIO = 1000;


/*
DISTANCIA HORIZONTAL DE LA ÓRBITA.

Aumenta este número para separar más
las tarjetas hacia los lados.
*/

const RADIO_X = 365;


/*
DISTANCIA VERTICAL DE LA ÓRBITA.

Aumenta este número para separar más
las tarjetas arriba y abajo.
*/

const RADIO_Y = 330;


/*
VELOCIDAD DE GIRO.
*/

const VELOCIDAD = 0.00022;



/* ================================================= */
/* ESCALA RESPONSIVA */
/* ================================================= */

function actualizarEscala(){

    const header =
    document
    .querySelector(".top-header")
    .getBoundingClientRect()
    .height;


    const anchoDisponible =
    Math.max(
        280,
        window.innerWidth - 16
    );


    const altoDisponible =
    Math.max(
        280,
        window.innerHeight -
        header -
        38
    );


    const escala =
    Math.min(

        anchoDisponible /
        ANCHO_ESCENARIO,

        altoDisponible /
        ALTO_ESCENARIO,

        0.82

    );


    document.documentElement
    .style
    .setProperty(
        "--escala-vitrina",
        escala.toFixed(4)
    );

}



/* ================================================= */
/* GALERÍA */
/* ================================================= */

function cargarGaleria(imagenes){

    miniaturas.innerHTML = "";


    imagenPrincipal.src =
    imagenes[0];


    imagenes.forEach(imagen => {

        const mini =
        document.createElement("img");


        mini.src = imagen;

        mini.alt =
        "Vista del producto";


        mini.addEventListener(
            "click",
            () => {

                imagenPrincipal.src =
                imagen;

                crearParticulas();

            }
        );


        miniaturas.appendChild(mini);

    });

}



/* ================================================= */
/* ABRIR PRODUCTOS */
/* ================================================= */

tarjetas.forEach(card => {

    card.addEventListener(
        "click",
        () => {

            crearParticulas();


            productoSeleccionado =
            card.dataset.nombre;


            nombreProducto.textContent =
            card.dataset.nombre;


            precioProducto.textContent =
            card.dataset.precio;


            descripcionProducto.textContent =
            card.dataset.descripcion;


            const listaImagenes =
            card.dataset.imagenes

            .split(",")

            .map(
                imagen =>
                imagen.trim()
            )

            .filter(Boolean);


            cargarGaleria(
                listaImagenes
            );


            modal.classList.add(
                "activo"
            );


            modalAbierto = true;

        }
    );

});



/* ================================================= */
/* CERRAR MODAL */
/* ================================================= */

function cerrarModal(){

    modal.classList.remove(
        "activo"
    );

    modalAbierto = false;

}


cerrar.addEventListener(
    "click",
    cerrarModal
);


modal.addEventListener(
    "click",
    evento => {

        if(
            evento.target === modal
        ){

            cerrarModal();

        }

    }
);


document.addEventListener(
    "keydown",
    evento => {

        if(
            evento.key === "Escape"
        ){

            cerrarModal();

        }

    }
);



/* ================================================= */
/* WHATSAPP */
/* ================================================= */

btnWhatsapp.addEventListener(
    "click",
    () => {

        const mensaje =

        `Hola, me interesa la ${productoSeleccionado}. ¿Me puede dar información y precio?`;


        window.open(

            "https://wa.me/?text=" +

            encodeURIComponent(
                mensaje
            ),

            "_blank",

            "noopener"

        );

    }
);



/* ================================================= */
/* PARTÍCULAS */
/* ================================================= */

function crearParticulas(){

    for(
        let i = 0;
        i < 32;
        i++
    ){

        const particula =
        document.createElement("div");


        particula.className =
        "particula";


        particula.style.left =
        "50%";


        particula.style.top =
        "50%";


        particula.style.setProperty(

            "--x",

            `${
                Math.random() *
                600 -
                300
            }px`

        );


        particula.style.setProperty(

            "--y",

            `${
                Math.random() *
                600 -
                300
            }px`

        );


        document.body.appendChild(
            particula
        );


        setTimeout(
            () => {

                particula.remove();

            },

            1000
        );

    }

}



/* ================================================= */
/* MOVIMIENTO DE LA ÓRBITA */
/* ================================================= */

function girarTarjetas(tiempo){

    const delta =
    Math.min(
        40,
        tiempo - ultimoTiempo
    );


    ultimoTiempo = tiempo;


    if(!modalAbierto){

        angulo +=
        VELOCIDAD *
        delta;

    }


    tarjetasOrbita.forEach(

        (tarjeta,index) => {

            const a =

            angulo +

            index *

            (
                Math.PI *
                2 /
                tarjetasOrbita.length
            );


            const x =

            Math.cos(a) *
            RADIO_X;


            const y =

            Math.sin(a) *
            RADIO_Y;


            const profundidad =

            Math.sin(a);


            const escala =

            0.82 +

            (
                (
                    profundidad +
                    1
                ) /
                2
            ) *

            0.18;


            tarjeta.style.transform =

            `translate(
                calc(-50% + ${x}px),
                calc(-50% + ${y}px)
            )
            scale(${escala})`;


            tarjeta.style.zIndex =

            String(

                120 +

                Math.round(

                    (
                        profundidad +
                        1
                    ) *

                    45

                )

            );

        }

    );


    /*
    La tarjeta principal permanece
    exactamente en el centro.
    */

    tarjetaCentro.style.transform =

    "translate(-50%,-50%) scale(1)";


    tarjetaCentro.style.zIndex =
    "300";


    requestAnimationFrame(
        girarTarjetas
    );

}



/* ================================================= */
/* CAMBIO AUTOMÁTICO DE TARJETA CENTRAL */
/* ================================================= */

function cambiarCentro(){

    if(
        modalAbierto ||
        tarjetasOrbita.length === 0
    ){

        return;

    }


    const nuevaCentral =
    tarjetasOrbita.shift();


    const anteriorCentral =
    tarjetaCentro;


    anteriorCentral
    .classList
    .remove("principal");


    anteriorCentral
    .querySelector(".diamante")
    .classList
    .remove("grande");


    nuevaCentral
    .classList
    .add("principal");


    nuevaCentral
    .querySelector(".diamante")
    .classList
    .add("grande");


    tarjetasOrbita.push(
        anteriorCentral
    );


    tarjetaCentro =
    nuevaCentral;

}



/* ================================================= */
/* MENÚ HAMBURGUESA */
/* ================================================= */

btnMenu.addEventListener(
    "click",
    () => {

        menuHamburguesa
        .classList
        .toggle("activo");

    }
);


document.addEventListener(
    "click",
    evento => {

        if(

            !menuHamburguesa
            .contains(
                evento.target
            )

            &&

            evento.target !==
            btnMenu

        ){

            menuHamburguesa
            .classList
            .remove("activo");

        }

    }
);



/* ================================================= */
/* CAMBIO DE TAMAÑO */
/* ================================================= */

window.addEventListener(

    "resize",

    actualizarEscala

);


window.addEventListener(

    "orientationchange",

    () => {

        setTimeout(

            actualizarEscala,

            150

        );

    }

);



/* ================================================= */
/* INICIAR */
/* ================================================= */

actualizarEscala();


tarjetas.forEach(

    (card,index) => {

        card.style.opacity =
        "0";


        setTimeout(

            () => {

                card.style.opacity =
                "1";

            },

            index * 140

        );

    }

);


requestAnimationFrame(
    girarTarjetas
);


setInterval(

    cambiarCentro,

    5000

);

</script>

<!DOCTYPE html>
<html lang="es">


<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal Cards</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    perspective:1600px;

    background:#000;
}
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(8px);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:.3s ease;
    z-index:9999;
    padding:20px;
}

.modal.active{
    opacity:1;
    pointer-events:all;
}

.modal-box{
    width:100%;
    max-width:650px;
    background:#121212;
    padding:clamp(15px,4vw,30px);
    border-radius:20px;
    color:white;
    text-align:center;
    transform:scale(.85);
    transition:.3s ease;
}

.modal.active .modal-box{
    transform:scale(1);
}

/* 🔥 AJUSTE SOLO AQUÍ */
.modal-box img{
    width:100%;
    height:auto;
    max-height:70vh;
    object-fit:contain;   /* YA NO SE CORTA */
    border-radius:15px;
    margin-bottom:20px;
    background:black;
}

.modal-box p{
    margin-bottom:20px;
    line-height:1.6;
    font-size:clamp(14px,3.5vw,16px);
}

.modal-box button{
    padding:10px 25px;
    border:none;
    border-radius:8px;
    background:#ff00cc;
    color:white;
    cursor:pointer;
    
    position:relative;
}

.close-x{
    position:absolute;
    top:10px;
    right:15px;
    font-size:22px;
    cursor:pointer;
    color:white;
}
.box{
  background:#fff;
  padding:20px;
  border-radius:15px;
  width:260px;
  text-align:center;
}

.out-img{
  position:absolute;
  top:10px;
  left:10px;
  width:calc(100% - 20px);
  height:calc(100% - 20px);
  object-fit:cover;
  border-radius:30px;
 z-index: 9999;

  opacity:0;
  pointer-events:none;
  transform: scale(0.8);
}

.out-img.active{
  animation: popOut 0.6s cubic-bezier(.25,.8,.25,1) forwards;
}

@keyframes popOut{
  0%{
    opacity:1;
    transform: scale(1);
  }
  60%{
    opacity:1;
    transform: scale(1.7) translateZ(150px);
  }
  100%{
    opacity:0;
    transform: scale(2.2) translateZ(400px);
  }
}

/*=========================
RESET
=========================*/

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

/*=========================
FONDO
=========================*/

body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}
body::before{
    content:"";
    position:absolute;

    inset:-4px;

    border-radius:30px;

    background:linear-gradient(
        135deg,

        #ff00ff 0%,
        #e600ff 20%,
        #b400ff 40%,
        #8a4dff 50%,
        #b400ff 60%,
        #e600ff 80%,
        #ff00ff 100%
    );

    z-index:-1;

    box-shadow:
        0 0 20px rgba(255,0,255,.9),
        0 0 40px rgba(180,0,255,.8),
        0 0 70px rgba(180,0,255,.6);
}
/*=========================
ESCENA PRINCIPAL
=========================*/

.scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}
/*=========================
VIDEO DEL PORTAL
=========================*/
#portal{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:100vw;
    height:100vh;

    object-fit:contain;

    z-index:5;
    pointer-events:none;

    mask-image:radial-gradient(
        ellipse at center,
        black 45%,
        rgba(0,0,0,.85) 60%,
        transparent 100%
    );

    -webkit-mask-image:radial-gradient(
        ellipse at center,
        black 45%,
        rgba(0,0,0,.85) 60%,
        transparent 100%
    );
}
/*=========================
CONTENEDOR TARJETAS
=========================*/

.cards-container{
    position:absolute;
    inset:0;

    z-index:10;
}

/*=========================
TARJETAS
=========================*/

.product{
    position:absolute;

    left:50%;
    top:50%;

    width:230px;
    height:300px;

    transform:translate(-50%,-50%) scale(.1);

    opacity:0;

    border-radius:28px;
    overflow:visible;

    cursor:pointer;

    z-index:20;

    transition:transform 1s ease, opacity 1s ease;
}

/* HALO EXTERIOR */
.product::before{
    content:"";
    position:absolute;

    inset:-16px;

    border-radius:40px;

    background:
        radial-gradient(circle at 20% 20%, #ff4df5 0%, transparent 35%),
        radial-gradient(circle at 80% 20%, #8f3dff 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #00d9ff 0%, transparent 35%),
        radial-gradient(circle at 20% 80%, #7a00ff 0%, transparent 35%),
        radial-gradient(circle at center, #ff00cc55 0%, transparent 75%);

    filter:blur(20px);

    opacity:.95;

    z-index:-2;
}

/* MARCO DE COLORES */
.product::after{
    content:"";
    position:absolute;

    inset:-4px;

    border-radius:30px;

    background:linear-gradient(
        135deg,
        #ff00ff 0%,
        #b400ff 25%,
        #6d3cff 50%,
        #00bfff 75%,
        #67ffff 100%
    );

    z-index:-1;

    box-shadow:
        0 0 20px rgba(255,0,255,.9),
        0 0 40px rgba(180,0,255,.8),
        0 0 70px rgba(0,200,255,.6);
}

/* IMAGEN */
.product img{
    position:absolute;

    inset:6px;

    width:calc(100% - 12px);
    height:calc(100% - 12px);

    border-radius:22px;

    object-fit:cover;

    display:block;

    z-index:2;
}

/*=========================
MODAL
=========================*/

.modal{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.88);
    backdrop-filter:blur(12px);

    display:flex;
    justify-content:center;
    align-items:center;

    opacity:0;
    pointer-events:none;

    transition:.35s;

    z-index:9999;
}

.modal.active{
    opacity:1;
    pointer-events:auto;
}

.modal-box{
    width:100%;
    max-width:700px;

    background:#111;
    color:#fff;

    padding:30px;
    border-radius:20px;

    text-align:center;

    transform:scale(.85);
    transition:.35s;
}

.modal.active .modal-box{
    transform:scale(1);
}

.modal-box img{
    width:100%;
    max-height:65vh;
    object-fit:contain;

    border-radius:12px;
    margin-bottom:20px;
}

.modal-box h2{
    margin-bottom:10px;
    font-size:26px;
}

.modal-box p{
    margin-bottom:20px;
    line-height:1.6;
}

.modal-box button{
    padding:12px 25px;
    border:none;
    border-radius:10px;

    background:#7c2dff;
    color:white;

    cursor:pointer;
}

.close-x{
    position:absolute;
    top:15px;
    right:20px;

    font-size:26px;
    cursor:pointer;
}

/*=========================
RESPONSIVE
=========================*/

@media(max-width:768px){

    #portal{
        width:320px;
        height:320px;
    }

    .product{
        width:150px;
        height:205px;
    }

    .modal-box{
        padding:20px;
    }
}
/*=========================
TABLETS
=========================*/

@media (max-width:1024px){

    #portal{
        width:800px;
        height:800px;
    }

    .product{
        width:210px;
        height:285px;
    }

    .modal-box{
        max-width:90%;
        padding:25px;
    }

}

/*=========================
TELÉFONOS
=========================*/

@media (max-width:768px){

    #portal{
        width:600px;
        height:600px;
    }

    .product{
        width:150px;
        height:205px;
    }

    .modal-box{
        width:95%;
        padding:18px;
    }

    .modal-box h2{
        font-size:22px;
    }

    .modal-box p{
        font-size:15px;
    }

}

/*=========================
TELÉFONOS PEQUEÑOS
=========================*/

@media (max-width:480px){

    #portal{
        width:450px;
        height:450px;
    }

    .product{
        width:120px;
        height:165px;
    }

    .modal-box{
        width:96%;
        padding:15px;
        border-radius:15px;
    }

    .modal-box h2{
        font-size:18px;
    }

    .modal-box p{
        font-size:14px;
    }

    .modal-box button{
        width:100%;
    }

    .close-x{
        top:10px;
        right:15px;
        font-size:22px;
    }

}

.video-fondo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

#portal{
    z-index:5;
}

.cards-container{
    z-index:10;
}
/* ===================================================
   SOLO CELULARES Y TABLETS EN VERTICAL
   Oculta el video frontal
=================================================== */

@media screen and (max-width:1024px) and (orientation:portrait){

    #portal{
        display:none !important;
    }

    .video-fondo{
        display:block !important;
        width:100%;
        height:100%;
        object-fit:cover;
    }

}

/* En horizontal vuelve a mostrarse */

@media screen and (max-width:1024px) and (orientation:landscape){

    #portal{
        display:block !important;
    }

}

</style>

<body>

<!-- =========================
ESCENA PRINCIPAL
========================= -->



    <!-- =========================
    VIDEO DEL REMOLINO
    ========================= -->

<!-- =========================
ESCENA PRINCIPAL
========================= -->

<div class="scene">

    <!-- Video de fondo -->
    <video class="video-fondo" autoplay muted loop playsinline>
        <source src="fondocorazong.mp4" type="video/mp4">
    </video>

    <!-- Video del portal -->
    <video id="portal" muted playsinline preload="auto" loop autoplay>
        <source src="fondocorazong.mp4" type="video/mp4">
    </video>

    <div class="portal-glow"></div>

    <!-- Contenedor de tarjetas -->
    <div id="cards" class="cards-container"></div>

</div>

<!-- =========================
MODAL
========================= -->

<div class="modal" id="modal">

    <div class="modal-box">

        <span class="close-x" id="closeX">✕</span>

        <img id="modalImg" src="" alt="">

        <h2 id="modalTitle"></h2>

        <p id="modalText"></p>

        <button id="closeBtn">Cerrar</button>

    </div>

</div>

<!-- =========================
JAVASCRIPT (DESPUÉS)
========================= -->


<script>
const portal = document.getElementById("portal");
const container = document.getElementById("cards");
portal.loop = true;
portal.play();
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");
const modalTitle = document.getElementById("modalTitle");
const modalText = document.getElementById("modalText");

const closeX = document.getElementById("closeX");
const closeBtn = document.getElementById("closeBtn");

const data = [
  { img: "chamarra1 (1).png", title: "1", text: "1" },
  { img: "chamarra1 (2).png", title: "2", text: "2" },
  { img: "chamarra1 (3).png", title: "3", text: "3" },
  { img: "chamarra1 (4).png", title: "4", text: "4" },
  { img: "chamarra1 (5).png", title: "5", text: "5" },
  { img: "chamarra1 (6).png", title: "6", text: "6" },
];

let cards = [];
let index = 0;

let state = "spawn";

let angle = 0;
let orbitSpeed = 0.012;
function updateRadius(){

    const cardWidth = window.innerWidth <= 480 ? 95 :
                      window.innerWidth <= 768 ? 120 :
                      window.innerWidth <= 1024 ? 210 : 260;

    const total = data.length;

    // separación deseada entre tarjetas
    const separation = cardWidth + 40;

    // radio mínimo para que no se encimen
    const minRadius = (separation * total) / (2 * Math.PI);

    if(window.innerWidth <= 480){
        radius = Math.max(minRadius, 170);
    }
    else if(window.innerWidth <= 768){
        radius = Math.max(minRadius, 220);
    }
    else if(window.innerWidth <= 1024){
        radius = Math.max(minRadius, 290);
    }
    else{
        radius = 360;
    }
}

updateRadius();
window.addEventListener("resize", updateRadius);

let modalOpen = false;
let orbitStartTime = 0;

// =========================
// MODAL
// =========================
function openModal(d){
  modalOpen = true;
  modal.classList.add("active");

  modalImg.src = d.img;
  modalTitle.textContent = d.title;
  modalText.textContent = d.text;

 // portal.pause();
}

function closeModal(){
  modalOpen = false;
  modal.classList.remove("active");
  portal.play();
}

closeX.onclick = closeBtn.onclick = closeModal;

// =========================
// CREAR TARJETAS
// =========================
function createCards(){
  container.innerHTML = "";

  data.forEach(d=>{
    const el = document.createElement("div");
    el.className = "product";

    el.innerHTML = `<img src="${d.img}">`;

    el.dataset.title = d.title;
    el.dataset.text = d.text;
    el.dataset.img = d.img;

    el.onclick = ()=>openModal(d);

    container.appendChild(el);
  });

  cards = document.querySelectorAll(".product");
}

// =========================
// SPAWN (UNA POR UNA, GRANDES)
// =========================
function spawn(){

  if(index >= cards.length){
    state = "orbit";
    orbitStartTime = Date.now();
    loop();
    return;
  }

  const c = cards[index];

  // 🔥 1. aparece desde cero (igual que nextCard pero más suave)
  c.style.opacity = "1";
  c.style.transition = "1.2s cubic-bezier(.25,.8,.25,1)";
  c.style.transform = "translate(-50%,-50%) scale(1.5)";

  setTimeout(() => {

    // 🔥 2. efecto centro (igual idea de nextCard)
  const a = (index / cards.length) * Math.PI * 2;

const x = Math.cos(a) * radius;
const y = Math.sin(a) * radius;
    c.dataset.x = x;
    c.dataset.y = y;

    // 🔥 salida a órbita (igual nextCard)
    c.style.transition = "1s cubic-bezier(.25,.8,.25,1)";
    c.style.transform =
      `translate(calc(-50% + ${x}px),
                 calc(-50% + ${y}px))
       scale(1)`;

    index++;

    // 🔥 CONTROL DE RITMO (ESTO ES LO IMPORTANTE)
    setTimeout(spawn, 650);

  }, 1200); // 🔥 tiempo en centro (IGUAL “impacto” que nextCard)
}
// =========================
// ORBITA LIMPIA Y SEPARADA
// =========================
function loop(){

  if(state !== "orbit") return;

  if(modalOpen){
    requestAnimationFrame(loop);
    return;
  }

  angle += orbitSpeed;

  cards.forEach((c,i)=>{

    const offset = (Math.PI * 2 / cards.length) * i;

    const x = Math.cos(angle + offset) * radius;
    const y = Math.sin(angle + offset) * radius;

    c.dataset.x = x;
    c.dataset.y = y;

    c.style.transition = "0s";
    c.style.transform =
      `translate(calc(-50% + ${x}px),
                 calc(-50% + ${y}px))
       scale(1)`;
  });

  if(Date.now() - orbitStartTime > 8000){
    returnCycle();
    return;
  }

  requestAnimationFrame(loop);
}

// =========================
// REGRESO AL REMOLINO
// =========================
function returnCycle(){

  state = "return";

  cards.forEach((c,i)=>{

    setTimeout(()=>{

      c.style.transition = "0.6s";
      c.style.transform = "translate(-50%,-50%) scale(0.2)";
      c.style.opacity = "0";

    }, i * 80);

  });

  setTimeout(reset, 1400);
}

// =========================
// RESET TOTAL
// =========================
function reset(){

  index = 0;
  angle = 0;
  state = "spawn";

  createCards();

  setTimeout(()=>{
    spawn();
  }, 800);

  portal.currentTime = 0;
  portal.play();
}

// =========================
// INICIO
// =========================
portal.addEventListener("loadeddata", ()=>{
  portal.play();
  createCards();
  setTimeout(spawn, 800);
});
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone 3D Cycle</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  overflow:hidden;
    background:
    radial-gradient(
        circle at center,
        #000 0%,
        #000 40%,
        #0d0d0d 55%,
        #1d1d1d 72%,
        #303030 100%
    );
  display:flex;
  justify-content:center;
  align-items:center;
  perspective:1500px;
}

/* =================== HEADER =================== */

.top-header{
    background:#111;
    padding:12px 20px;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:99999;
    box-shadow:0 2px 10px rgba(0,0,0,.3);
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =================== BOTÓN HAMBURGUESA =================== */

.menu-btn{
    position:absolute;
    left:20px;
    background:none;
    border:none;
    color:#fff;
    font-size:32px;
    cursor:pointer;
}

/* =================== PESTAÑAS VISIBLES =================== */

.menu-categorias{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.menu-categorias a{
    color:#fff;
    text-decoration:none;
    padding:8px 14px;
    font-size:14px;
    font-weight:bold;
    border-radius:8px;
    transition:.3s;
    white-space:nowrap;
}

.menu-categorias a:hover{
    background:#fff;
    color:#000;
}

/* =================== MENÚ HAMBURGUESA =================== */

.menu-hamburguesa{
    display:none;
    position:fixed;
    top:65px;
    left:0;
    width:250px;
    background:#111;
    flex-direction:column;
    padding:10px 0;
    z-index:99999;
}

.menu-hamburguesa.activo{
    display:flex;
}

.menu-hamburguesa a{
    color:#fff;
    text-decoration:none;
    padding:14px;
    text-align:center;
    border-bottom:1px solid #333;
}

.menu-hamburguesa a:hover{
    background:#222;
}

/* =================== RESPONSIVE =================== */

@media(max-width:768px){

    .top-header{
        justify-content:center;
    }

    .menu-categorias{
        display:none;
    }

    .menu-btn{
        font-size:30px;
    }

}
.scene{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding-top:95px;
    padding-bottom:30px;
}
.phone{
    width:250px;
    height:520px;
    border-radius:34px;
    border:5px solid #444;
    position:relative;
    transform-style:preserve-3d;
    overflow:visible;
}

.screen{
  position:absolute;
  inset:10px;
  border-radius:30px;
  background:#222;
  overflow:hidden;
}
.screen{
  position:absolute;
  inset:10px;
  border-radius:30px;
  background:#222;
  overflow:hidden;
}

/* pantalla real (contenido base) */
#screenImg{
  width:100%;
  height:100%;
  object-fit:cover;
  position:absolute;
  inset:0;
  z-index:1;
}

/* VIDRIO ROTO ENCIMA */
.crack{
  position:absolute;
  inset:0;
  background:url("rototel1.jpg") center/cover no-repeat;
  opacity:0;
  z-index:5;
  pointer-events:none;
  mix-blend-mode: screen;
  transform:scale(1.1);
}

/* FLASH */
.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  z-index:10;
  pointer-events:none;
}

/* POLVO */
.dust{
  position:absolute;
  inset:0;
  background:radial-gradient(circle, rgba(255,255,255,0.35), transparent);
  opacity:0;
  z-index:6;
  pointer-events:none;
}
.crack{
  position:absolute;
  inset:0;
  background:url("rototel1.jpg") center/cover no-repeat;
  z-index:5;
  pointer-events:none;
  mix-blend-mode: screen;

  opacity:0;
  transform: scale(1.2);

  transition: opacity 0.6s ease, transform 0.8s ease, filter 0.8s ease;
}

/* 💥 estado inicial: roto */
.crack.active{
  opacity:1;
  animation: crackHit 0.6s ease-out forwards;
}
/* 🧲 estado cuando entran tarjetas (absorción visual) */
.crack.absorbing{
  opacity:0.3;
  transform: scale(0.95);
  filter: blur(4px);
}

/* ✨ estado final limpio (teléfono restaurado) */
.crack.clean{
  opacity:0;
  transform: scale(1);
  filter: blur(0px);
}

/* 🔥 SHAKE FUERTE DEL TELÉFONO */
@keyframes shake {
  0% { transform: translate(0,0) rotate(0deg); }
  10% { transform: translate(-6px,3px) rotate(-1deg); }
  20% { transform: translate(6px,-4px) rotate(1deg); }
  30% { transform: translate(-8px,5px); }
  40% { transform: translate(8px,-5px); }
  50% { transform: translate(-5px,2px); }
  60% { transform: translate(5px,-2px); }
  70% { transform: translate(-3px,1px); }
  80% { transform: translate(3px,-1px); }
  100% { transform: translate(0,0); }
}

/* 💥 FLASH MÁS BRUTAL */
.flash.active {
  animation: flashBoom 0.25s ease-out;
}

@keyframes flashBoom {
  0% { opacity: 0; }
  20% { opacity: 1; }
  100% { opacity: 0; }
}

/* 💔 CRACK IMPACTO REAL */
@keyframes crackHit {
  0% { transform: scale(0.6); filter: blur(6px); opacity: 0; }
  40% { transform: scale(1.4); filter: blur(0px); opacity: 1; }
  70% { transform: scale(1.1); }
  100% { transform: scale(1.05); }
}
.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  z-index:60;
  pointer-events:none;
}

.dust{
  position:absolute;
  inset:0;
  background:radial-gradient(circle, rgba(255,255,255,0.4), transparent);
  opacity:0;
  z-index:55;
  pointer-events:none;
}
.product{
    position:absolute;
    width:200px;
    height:270px;

    border-radius:15px;
    overflow:hidden;

    left:50%;
    top:50%;

    opacity:0;
    transform:translate(-50%,-50%) scale(.2);

    transition:1s;
    cursor:pointer;

    box-shadow:
        0 0 15px #ff00cc,
        0 0 35px rgba(255,0,204,.8),
        0 0 60px rgba(255,0,204,.4);
}
.product img{
  width:100%;
  height:100%;
  object-fit:cover;
}


.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(8px);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:.3s ease;
    z-index:9999;
    padding:20px;
}

.modal.active{
    opacity:1;
    pointer-events:all;
}

.modal-box{
    width:100%;
    max-width:650px;
    background:#121212;
    padding:clamp(15px,4vw,30px);
    border-radius:20px;
    color:white;
    text-align:center;
    transform:scale(.85);
    transition:.3s ease;
}

.modal.active .modal-box{
    transform:scale(1);
}

/* 🔥 AJUSTE SOLO AQUÍ */
.modal-box img{
    width:100%;
    height:auto;
    max-height:70vh;
    object-fit:contain;   /* YA NO SE CORTA */
    border-radius:15px;
    margin-bottom:20px;
    background:black;
}

.modal-box p{
    margin-bottom:20px;
    line-height:1.6;
    font-size:clamp(14px,3.5vw,16px);
}

.modal-box button{
    padding:10px 25px;
    border:none;
    border-radius:8px;
    background:#ff00cc;
    color:white;
    cursor:pointer;
    
    position:relative;
}

.close-x{
    position:absolute;
    top:10px;
    right:15px;
    font-size:22px;
    cursor:pointer;
    color:white;
}
.box{
  background:#fff;
  padding:20px;
  border-radius:15px;
  width:260px;
  text-align:center;
}
.ring{
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  display:flex;
  justify-content:center;
  align-items:center;
  transform-style:preserve-3d;
}
.screen{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    bottom:10px;
    border-radius:30px;
    overflow:hidden;
    background:#222;
     z-index: 1;
}

.screen-img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}


/* salida real tipo "sale de la pantalla" */
.screen-img.zoom-out {
  animation: zoomOut 0.6s cubic-bezier(.25,.8,.25,1) forwards;
}

@keyframes zoomOut {
  0% {
    transform: scale(1);
    filter: blur(0px);
    opacity: 1;
  }

  60% {
    transform: scale(1.6) translateZ(80px);
    filter: blur(0px);
    opacity: 1;
  }

  100% {
    transform: scale(2.2) translateZ(120px);
    opacity: 0;
    filter: blur(2px);
  }
}




.out-img{
  position:absolute;
  top:10px;
  left:10px;
  width:calc(100% - 20px);
  height:calc(100% - 20px);
  object-fit:cover;
  border-radius:30px;
 z-index: 9999;

  opacity:0;
  pointer-events:none;
  transform: scale(0.8);
}

.out-img.active{
  animation: popOut 0.6s cubic-bezier(.25,.8,.25,1) forwards;
}

@keyframes popOut{
  0%{
    opacity:1;
    transform: scale(1);
  }
  60%{
    opacity:1;
    transform: scale(1.7) translateZ(150px);
  }
  100%{
    opacity:0;
    transform: scale(2.2) translateZ(400px);
  }
}
.girl-out{
  position:absolute;
  top:50%;
  left:50%;
  width:200px;
  transform:translate(-50%,-50%) scale(0.3);
  opacity:0;
  z-index:9999;
  pointer-events:none;
}

.girl-out.active{
  animation: girlOut 0.8s forwards;
}

@keyframes girlOut{

  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.3);
  }

  50%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.1);
  }

  100%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.45);
  }

}
.girl-out.back{
  animation:girlBack .8s forwards;
}

@keyframes girlBack{

  0%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.45);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.3);
  }

}
.girl-out.back{
    animation: girlBack .8s forwards;
}

@keyframes girlBack{

    0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.25);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.3);
    }

}
</style>
</head>

<body>

<header class="top-header">

    <!-- BOTÓN HAMBURGUESA -->
    <button class="menu-btn" id="btnMenu">
        ☰
    </button>

    <!-- MENÚ NORMAL -->
    <nav class="menu-categorias">

        <a href="index.html">Essentials Fear Of God</a>

        <a href="indexcham2.html">Jacket Adidas</a>

        <a href="indexmex.html">PASION POR MEXICO</a>

        <a href="bts.html">Productos Coreanos</a>

        <a href="diamanteorbita.html">Diamante Órbita</a>

        <a href="telefono3d.html">Teléfono 3D</a>

    </nav>

    <!-- MENÚ HAMBURGUESA -->
    <nav class="menu-hamburguesa" id="menuHamburguesa">

        <a href="index.html">Inicio</a>

        <a href="indexcham2.html">Jacket Adidas</a>

        <a href="indexmex.html">PASION POR MEXICO</a>

        <a href="bts.html">Productos Coreanos</a>

        <a href="diamanteorbita.html">Diamante Órbita</a>

        <a href="telefono3d.html">Teléfono 3D</a>

    </nav>

</header>

<div class="scene">

    <div class="phone" id="phone">

        <!-- 📱 PANTALLA DEL TELÉFONO -->
        <div class="screen">
            <img src="panta1.png" class="screen-img" id="screenImg">
        </div>

        <!-- 👩 CHICA QUE SALE DEL TELÉFONO -->
        <img src="chicas.png" id="girl" class="girl-out">

        <!-- 💥 EFECTOS -->
        <div class="crack" id="crack"></div>
        <div class="flash" id="flash"></div>
        <div class="dust" id="dust"></div>

    </div>

</div>
</div>
<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">

    <span class="close-x" onclick="closeModal()">✕</span>

    <img id="modalImg" src="">

    <h3 id="modalTitle"></h3>

    <p id="modalText"></p>

    <button onclick="closeModal()">Cerrar</button>

  </div>
</div>

</body>
<script>
const phone = document.getElementById("phone");
const crack = document.getElementById("crack");
const screenImg = document.getElementById("screenImg");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");
const modalTitle = document.getElementById("modalTitle");
const modalText = document.getElementById("modalText");
const girl = document.getElementById("girl");
const container = document.querySelector(".scene");

let state = "intro";
let rotY = 0;
let angle = 0;
let index = 0;
let orbitTime = 0;
let returning = false;
let breakDone = false;

let activeCard = null;
let modalOpen = false; // 🔥 CONTROL GLOBAL

const data = [
  { img: "chamarra1 (1).png", title: "Chamarra México", text: "Chamarra premium impermeable" },
  { img: "chamarra1 (2).png", title: "Chamarra Invierno", text: "Ideal para frío extremo" },
  { img: "chamarra1 (3).png", title: "Chamarra Street", text: "Estilo urbano moderno" },
  { img: "chamarra1 (4).png", title: "Chamarra Ligera", text: "Perfecta para uso diario" },
  { img: "chamarra1 (5).png", title: "Chamarra Sport", text: "Comodidad y movimiento" },
  { img: "chamarra1 (6).png", title: "Chamarra Premium", text: "Diseño elegante y resistente" },
];

const radius = 260 + data.length * 35;
const orbitRadius = 320; // 🔥 MÁS ESPACIO ENTRE TARJETAS
const products = [];

/* =========================
   CREAR TARJETAS
========================= */
data.forEach(item => {

  const p = document.createElement("div");
  p.className = "product";

  const img = document.createElement("img");
  img.src = item.img;

  p.appendChild(img);
  container.appendChild(p);

  const obj = { el: p, data: item, x: 0, y: 0 };
  products.push(obj);

  p.addEventListener("click", () => {

    modalOpen = true; // 🔥 PAUSA TODO

    activeCard = obj;

    modalImg.src = obj.data.img;
    modalTitle.textContent = obj.data.title;
    modalText.textContent = obj.data.text;

    modal.classList.add("active");

    p.style.transition = "0.3s";
    p.style.transform = "translate(-50%,-50%) scale(2)";
    p.style.zIndex = "999";
  });

});

/* =========================
   CERRAR MODAL
========================= */
function closeModal() {

  modalOpen = false; // 🔥 REANUDA TODO

  modal.classList.remove("active");

  if (activeCard) {
    activeCard.el.style.transition = "0.6s";
    activeCard.el.style.transform =
      `translate(calc(-50% + ${activeCard.x}px),
                 calc(-50% + ${activeCard.y}px))
       scale(1)`;
    activeCard.el.style.zIndex = "1";
  }
}

/* =========================
   LOOP TELEFONO
========================= */
function phoneLoop() {

  if (modalOpen) {
    requestAnimationFrame(phoneLoop);
    return;
  }

  if (state === "intro") {

    rotY += 2;

    phone.style.transform = `rotateX(10deg) rotateY(${rotY}deg)`;

if (rotY >= 360 && !breakDone) {

  breakDone = true;

  rotY = 0;
  state = "spawn";

  // 💥 crack
  crack.classList.add("active");
  flash.classList.add("active");
  phone.style.animation = "shake 0.6s ease";

  // 📱 fondo cambia del teléfono
  screenImg.src = "silueta1.png";

  // 👩 SALE LA CHICA (IMPORTANTE)
 girl.classList.remove("back");
girl.classList.add("active");

  setTimeout(() => {
    flash.classList.remove("active");
    phone.style.animation = "";
  }, 300);

 
  // 🚀 2. TARJETAS EMPIEZAN DESPUÉS
  setTimeout(() => {
    nextCard();
  }, 700);
    }
  }

  requestAnimationFrame(phoneLoop);
}

phoneLoop();

/* =========================
   TARJETAS
========================= */
function nextCard() {

  if (index >= products.length) {
    state = "orbit";
    orbitTime = Date.now();
    orbitLoop();
    return;
  }

  const p = products[index];

  p.el.style.opacity = "1";
  p.el.style.transition = "1s";
  p.el.style.transform = "translate(-50%,-50%) scale(1.5)";

setTimeout(() => {

    const a = (index / products.length) * Math.PI * 2;

    p.x = Math.cos(a) * radius;
    p.y = Math.sin(a) * radius;

    p.el.style.transform =
      `translate(calc(-50% + ${p.x}px),
                 calc(-50% + ${p.y}px))
       scale(1)`;

    index++;
    nextCard();

}, 1200); // 🔥 MÁS LENTO Y ESTABLE
}

/* =========================
   ÓRBITA (MÁS SEPARADA)
========================= */
function orbitLoop() {

  if (modalOpen) {
    requestAnimationFrame(orbitLoop);
    return;
  }

  if (state !== "orbit") return;

  angle += 0.01;

  const paso = (Math.PI * 2) / products.length;

  products.forEach((obj, i) => {

    const a = angle + i * paso;

    obj.x = Math.cos(a) * orbitRadius;
    obj.y = Math.sin(a) * orbitRadius;

    obj.el.style.transition = "0s";

    obj.el.style.transform =
      `translate(calc(-50% + ${obj.x}px),
                 calc(-50% + ${obj.y}px))
       scale(1)`;

  });

  if (!returning && Date.now() - orbitTime > 8000) {
    returning = true;
    returnToPhone();
  }

  requestAnimationFrame(orbitLoop);
}
/* =========================
   RESET
========================= */
function returnToPhone() {

  state = "returning";
  // Cambia inmediatamente el fondo
  screenImg.src = "imagente2.png";
  // 👩 La chica regresa al teléfono
  girl.classList.remove("active");
  girl.classList.add("back");

  products.forEach((obj, i) => {

    setTimeout(() => {
      obj.el.style.transition = "0.8s";
      obj.el.style.transform = "translate(-50%,-50%) scale(0.1)";
      obj.el.style.opacity = "0";
    }, i * 80);

  });

  setTimeout(() => {

    // Reiniciar el ciclo
    index = 0;
    angle = 0;
    rotY = 0;
    orbitTime = 0;
    returning = false;
    breakDone = false;

    resetCycle();

  }, 1500);
}

/* =========================
   RESET TOTAL
========================= */
function resetCycle(){

  index = 0;
  angle = 0;
  rotY = 0;
  orbitTime = 0;
  returning = false;
  breakDone = false;

  screenImg.src = "panta1.png";

  girl.classList.remove("back");
  girl.classList.remove("active");

  crack.classList.remove("active");
  crack.style.opacity = "0";

  phone.style.transition = "none";
  phone.style.transform = "rotateX(10deg) rotateY(0deg)";

  products.forEach(p => {

    p.x = 0;
    p.y = 0;

    p.el.style.transition = "none";
    p.el.style.opacity = "0";
    p.el.style.transform = "translate(-50%,-50%) scale(.2)";
  });

  state = "intro";
}

const btnMenu = document.getElementById("btnMenu");
const menuHamburguesa = document.getElementById("menuHamburguesa");

btnMenu.addEventListener("click", () => {
    menuHamburguesa.classList.toggle("activo");
});
</script>
</body>
</html>

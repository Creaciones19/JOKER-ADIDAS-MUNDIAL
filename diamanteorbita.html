<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vitrina Holográfica Premium</title>

<style>
    *{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

background:

radial-gradient(
circle at center,
#5b008f 0%,
#120018 45%,
#000 100%
);

font-family:Arial, sans-serif;

overflow:hidden;

color:white;

display:flex;

justify-content:center;

align-items:center;

perspective:1200px;

}




.escena{

width:100%;

height:100vh;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

}




.titulo{

position:absolute;

top:30px;

font-size:35px;

letter-spacing:5px;

color:#ff7cff;

text-shadow:

0 0 20px #ff00ff,
0 0 50px #8a00ff;

}




/* CONTENEDOR DIAMANTE */

.diamante-container{

position:relative;

width:900px;

height:850px;

transform-style:preserve-3d;

}





/* POSICIONES FORMA DIAMANTE */

/* POSICIONAMIENTO VITRINA */

.diamante-container{

position:relative;

width:900px;
height:900px;

display:flex;

justify-content:center;

align-items:center;

}


/* TODOS LOS DIAMANTES */

.diamante-card{

position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

}


.principal{

z-index:50;

}

/* DIAMANTE */

.diamante{


width:230px;

height:230px;


transform:

rotate(45deg);


padding:10px;


border-radius:45px;


background:

linear-gradient(
135deg,
#ffffff,
#ff00ff,
#6500ff,
#00ffff,
#ffffff
);


box-shadow:


0 0 30px #ff00ff,

0 0 80px #7200ff,

0 0 150px #00ffff;



position:relative;


overflow:hidden;


}





/* CENTRAL MAS GRANDE */


.diamante.grande{


width:330px;

height:330px;


box-shadow:


0 0 50px #ff00ff,

0 0 130px #7200ff,

0 0 200px #00ffff;


}




/* INTERIOR NEGRO */


.diamante-interior{


width:100%;

height:100%;


background:

radial-gradient(
circle,
#240024,
#000
);



border-radius:35px;


overflow:hidden;


display:flex;

align-items:center;

justify-content:center;


}





.diamante-interior img{


width:150%;

height:150%;


object-fit:contain;


transform:

rotate(-45deg);


filter:

drop-shadow(
0 0 30px #ff00ff
);


transition:.6s;


}






.diamante-card:not(.principal):hover{

transform:

translateZ(80px)
scale(1.15);

}



@keyframes flotar{


0%,100%{

margin-top:0;

}


50%{

margin-top:-25px;

}


}






/* REFLEJO DE LUZ */


.diamante::after{


content:"";


position:absolute;


width:50px;

height:400px;


background:white;


opacity:.35;


top:-100px;

left:-100px;


transform:

rotate(35deg);


animation:

reflejo 3s infinite;


}




@keyframes reflejo{


0%{

left:-200px;

}


100%{

left:400px;

}


}







/* MODAL */


.modal{


position:fixed;

inset:0;


background:

rgba(0,0,0,.85);


display:flex;

align-items:center;

justify-content:center;


opacity:0;


pointer-events:none;


transition:.5s;


z-index:20;


}





.modal.activo{


opacity:1;

pointer-events:auto;


}






.modal-contenido{


background:

linear-gradient(
145deg,
#120012,
#320040
);


padding:40px;


border-radius:35px;


width:500px;


max-width:90%;


text-align:center;


box-shadow:


0 0 80px #ff00ff;


animation:

entradaModal .7s;


}



@keyframes entradaModal{


from{

transform:

scale(.2)
rotateY(180deg);


opacity:0;


}


to{

transform:

scale(1)
rotateY(0);


opacity:1;


}


}







.cerrar{


position:absolute;


margin-left:420px;


background:none;


border:none;


color:white;


font-size:30px;


cursor:pointer;


}








/* DIAMANTE DEL MODAL */


.diamante-modal{


width:300px;

height:300px;


margin:auto;


transform:

rotate(45deg);


border-radius:40px;


overflow:hidden;


padding:10px;


background:

linear-gradient(
135deg,
white,
#ff00ff,
#7200ff
);


box-shadow:

0 0 60px #ff00ff;


}



.diamante-modal img{


width:150%;

height:150%;


object-fit:contain;


transform:

rotate(-45deg);


}






/* MINIATURAS */


.miniaturas{


display:flex;


justify-content:center;


gap:10px;


margin-top:40px;


flex-wrap:wrap;


}



.miniaturas img{


width:55px;


height:55px;


object-fit:contain;


border-radius:10px;


background:#000;


padding:5px;


cursor:pointer;


box-shadow:

0 0 15px #ff00ff;


transition:.3s;


}




.miniaturas img:hover{


transform:scale(1.2);


}







#nombreProducto{


margin-top:40px;


font-size:28px;


color:#ff7cff;


}




#precioProducto{


color:#00ffff;


font-size:25px;


margin-top:10px;


}





#descripcionProducto{


margin-top:15px;


color:#ddd;


line-height:1.5;


}






.whatsapp{


margin-top:25px;


padding:15px 35px;


border:none;


border-radius:30px;


background:#25D366;


color:white;


font-size:18px;


cursor:pointer;


box-shadow:

0 0 30px #25D366;


}








/* PARTICULAS */


.particula{


position:fixed;


width:8px;


height:8px;


border-radius:50%;


background:#ff00ff;


box-shadow:

0 0 20px #ff00ff;


pointer-events:none;


animation:

explosion 1s forwards;


}



@keyframes explosion{


to{


transform:

translate(
var(--x),
var(--y)
)
scale(0);


opacity:0;


}


}






/* ============================= */
/* TABLET Y CELULAR */
/* ============================= */

/* ============================= */

@media(max-width:600px){

overflow:hidden;

}



.escena{

width:100%;
height:100vh;

}



.titulo{

top:20px;

}



.diamante-container{

width:600px;

height:600px;

transform:scale(.50);

}



/* NO PONER TOP LEFT A LAS TARJETAS */
/* JAVASCRIPT CONTROLA LA ORBITA */



.diamante{

width:150px;

height:150px;

}



.diamante.grande{

width:220px;

height:220px;

}



.modal-contenido{

width:95%;

padding:20px;

/* ============================= */
/* CELULAR PEQUEÑO */
/* ============================= */


@media(max-width:380px){


.diamante-container{

width:550px;

height:550px;

transform:scale(.43);

}



.titulo{

font-size:16px;

}



.modal-contenido{

padding:15px;

}



}

/* AJUSTA TODO  EL RESPONSIVE SEGUN ESTO HAY QUE CHECAR O QUITAR*/
/* ============================= */
/* ========================================= */
/* TABLETS */
/* ========================================= */

@media (max-width:1100px){

    .escena{
        width:100vw;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
    }

    .diamante-container{
        width:min(90vw,900px);

        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .diamante-container{

}

        width:100vw;

}


</style>

</head>


<body>


<div class="escena">

✕
</button>

</div>

</h2>

</h3>

</p>

class="whatsapp">

Comprar por WhatsApp

<script>
    const tarjetas = document.querySelectorAll(".diamante-card");


const modal = document.getElementById("modal");

const imagenPrincipal = document.getElementById("imagenPrincipal");

const miniaturas = document.getElementById("miniaturas");

const nombreProducto = document.getElementById("nombreProducto");

const precioProducto = document.getElementById("precioProducto");

const descripcionProducto = document.getElementById("descripcionProducto");

const cerrar = document.querySelector(".cerrar");

const btnWhatsapp = document.getElementById("btnWhatsapp");



let productoSeleccionado = "";







/* ABRIR PRODUCTO */


tarjetas.forEach(card=>{


card.addEventListener("click",()=>{


crearParticulas();



productoSeleccionado =
card.dataset.nombre;



nombreProducto.textContent =
card.dataset.nombre;



precioProducto.textContent =
card.dataset.precio;



descripcionProducto.textContent =
card.dataset.descripcion;





let listaImagenes = 
card.dataset.imagenes
.split(",")
.map(img=>img.trim());





cargarGaleria(listaImagenes);




modal.classList.add("activo");



});



});









/* CARGAR IMAGEN PRINCIPAL Y MINIATURAS */


function cargarGaleria(imagenes){



miniaturas.innerHTML="";



imagenPrincipal.src =
imagenes[0];




imagenes.forEach((imagen,index)=>{



let mini = document.createElement("img");



mini.src = imagen;



mini.onclick = ()=>{


imagenPrincipal.src = imagen;



crearParticulas();


};



miniaturas.appendChild(mini);



});



}










/* CERRAR MODAL */


cerrar.onclick=()=>{


modal.classList.remove("activo");


};






modal.onclick=(e)=>{


if(e.target===modal){


modal.classList.remove("activo");


}



};









/* WHATSAPP */


btnWhatsapp.onclick=()=>{



let mensaje =

`Hola, me interesa la ${productoSeleccionado}. ¿Me puede dar información y precio?`;




window.open(

"https://wa.me/?text="+

encodeURIComponent(mensaje)

);



};









/* PARTICULAS HOLOGRAFICAS */


function crearParticulas(){



for(let i=0;i<40;i++){



let p=document.createElement("div");



p.className="particula";



p.style.left="50%";

p.style.top="50%";





let x =
(Math.random()*600)-300;



let y =
(Math.random()*600)-300;





p.style.setProperty(
"--x",
x+"px"
);



p.style.setProperty(
"--y",
y+"px"
);





document.body.appendChild(p);





setTimeout(()=>{


p.remove();



},1000);





}



}









/* ROTACION 3D SUAVE */





/* EFECTO ENTRADA HOLOGRAFICA */



window.onload=()=>{


document.querySelectorAll(".diamante-card")
.forEach((card,index)=>{


card.style.opacity="0";


setTimeout(()=>{


card.style.opacity="1";


},index*200);



});



};
let tarjetaCentro = document.querySelector(".principal");


let tarjetasOrbita = [
document.querySelector(".posicion1"),
document.querySelector(".posicion2"),
document.querySelector(".posicion3"),
document.querySelector(".posicion4"),
document.querySelector(".posicion5")
];


let angulo = 0;

let radio = 380;

if(window.innerWidth <= 1100){
    radio = 320;
}

if(window.innerWidth <= 800){
    radio = 280;
}

if(window.innerWidth <= 600){
    radio = 230;
}

if(window.innerWidth <= 380){
    radio = 190;
}

let velocidad = 0.035;

// Tablet
if (window.innerWidth <= 1100){
    velocidad = 0.022;
}

// Tablet vertical
if (window.innerWidth <= 800){
    velocidad = 0.014;
}

// Celular
if (window.innerWidth <= 600){
    velocidad = 0.009;
}

// Celular pequeño
if (window.innerWidth <= 380){
    velocidad = 0.007;
}
// GIRO DE LAS 5 TARJETAS
function girarTarjetas(){


angulo += velocidad * (60 / (screen.orientation ? screen.orientation.type.includes("landscape") ? 60 : 120 : 60));


tarjetasOrbita.forEach((tarjeta,index)=>{


let a =
angulo +
(index * (Math.PI*2 / tarjetasOrbita.length));



let x =
Math.cos(a) * radio;


let y =
Math.sin(a) * radio;



let profundidad =
Math.sin(a);



let escala =
0.75 + ((profundidad+1)/2)*0.25;



tarjeta.style.transform =

`
translate(
calc(-50% + ${x}px),
calc(-50% + ${y}px)
)
scale(${escala})
`;


tarjeta.style.zIndex =
100 + Math.floor(profundidad*50);



});


requestAnimationFrame(girarTarjetas);

}


girarTarjetas();



// CAMBIO CUANDO UNA TARJETA PASA ARRIBA

setInterval(()=>{


let nuevaCentral = tarjetasOrbita.shift();


// LA DEL CENTRO SALE A LA ÓRBITA

tarjetasOrbita.push(tarjetaCentro);


// NUEVA TARJETA AL CENTRO

// NUEVA TARJETA AL CENTRO

nuevaCentral.style.transform =
`
translate(-50%,-50%)
scale(1.2)
`;


// hacerla tamaño protagonista
let diamanteNuevo =
nuevaCentral.querySelector(".diamante");

diamanteNuevo.classList.add("grande");

tarjetaCentro.style.transform =
`
translate(
calc(-50% + 0px),
calc(-50% + 0px)
)
scale(1)
`;


// quitar tamaño grande cuando sale del centro
let diamanteAnterior =
tarjetaCentro.querySelector(".diamante");

diamanteAnterior.classList.remove("grande");


tarjetaCentro.style.zIndex = 100;



tarjetaCentro = nuevaCentral;



},5000);
</script>

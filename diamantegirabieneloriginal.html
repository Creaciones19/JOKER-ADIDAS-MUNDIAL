<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Objeto 3D con 6 tarjetas triangulares</title>

<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    position:relative;

    padding-top:90px;

    background:
        radial-gradient(
            circle at 20% 25%,
            rgba(178, 0, 255, .45) 0%,
            rgba(178, 0, 255, .15) 20%,
            transparent 42%
        ),

        radial-gradient(
            circle at 82% 28%,
            rgba(0, 210, 255, .38) 0%,
            rgba(0, 210, 255, .10) 22%,
            transparent 43%
        ),

        radial-gradient(
            circle at 50% 85%,
            rgba(255, 0, 157, .28) 0%,
            transparent 38%
        ),

        linear-gradient(
            145deg,
            #03020a 0%,
            #10051d 35%,
            #151026 65%,
            #02040b 100%
        );

    background-attachment:fixed;

    font-family:Arial, Helvetica, sans-serif;
}

.titulo-producto{
    position:absolute;

    top:26px;
    left:50%;

    transform:translateX(-50%);

    z-index:100;

    width:100%;

    padding:0 20px;

    color:#ffffff;

    font-size:clamp(28px, 4.2vw, 58px);
    font-weight:900;

    letter-spacing:4px;
    line-height:1.05;

    text-align:center;
    text-transform:uppercase;

    text-shadow:
        0 0 8px rgba(255,255,255,.7),
        0 0 18px rgba(196,87,255,.75),
        0 0 35px rgba(61,203,255,.45);

    background:
        linear-gradient(
            90deg,
            #ffffff 0%,
            #bfefff 25%,
            #ffffff 48%,
            #efc4ff 72%,
            #ffffff 100%
        );

    background-size:200% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        brilloTitulo 5s linear infinite;

    pointer-events:none;
}


.titulo-producto span{
    display:block;

    margin-top:7px;

    color:#dcbaff;

    font-size:clamp(13px, 1.6vw, 21px);
    font-weight:600;

    letter-spacing:8px;

    text-shadow:
        0 0 12px rgba(190,104,255,.8);

    -webkit-text-fill-color:#dcbaff;
}


@keyframes brilloTitulo{

    from{
        background-position:200% center;
    }

    to{
        background-position:-200% center;
    }

}

/* =========================================================
   ESCENA 3D
========================================================= */

.escena-3d{

    position:relative;

    width:700px;
    height:700px;

    display:flex;
    align-items:center;
    justify-content:center;

    perspective:1400px;
    perspective-origin:center;

    transform:translateY(-85px);

}
/* =========================================================
   OBJETO COMPLETO
========================================================= */

.objeto-3d{
    position:relative;

    width:360px;
    height:360px;

    transform-style:preserve-3d;

    transform:
        rotateX(-10deg)
        rotateY(0deg);

    cursor:grab;
    will-change:transform;
}

.objeto-3d:active{
    cursor:grabbing;
}


/* VUELTA COMPLETA DE LA FIGURA UNIDA */

.objeto-3d.girando-figura{
    animation:
        vueltaCompletaFigura 8s linear 1;
}

@keyframes vueltaCompletaFigura{

    0%{
        transform:
            rotateX(-10deg)
            rotateY(0deg);
    }

    25%{
        transform:
            rotateX(20deg)
            rotateY(90deg);
    }

    50%{
        transform:
            rotateX(-10deg)
            rotateY(180deg);
    }

    75%{
        transform:
            rotateX(-28deg)
            rotateY(270deg);
    }

    100%{
        transform:
            rotateX(-10deg)
            rotateY(360deg);
    }

}


/* Durante la órbita, el contenedor permanece estable */

.objeto-3d.en-orbita{
    transform:
        rotateX(0deg)
        rotateY(0deg);
}


/* Al unirse, conserva la forma triangular original */

.objeto-3d.figura-unida{
    transform:
        rotateX(-10deg)
        rotateY(0deg);
}


/* =========================================================
   CADA TARJETA TRIANGULAR
========================================================= */

.tarjeta-triangular{
    position:absolute;

    left:50%;
    top:50%;

    width:320px;
    height:295px;

    margin-left:-160px;
    margin-top:-147px;

    transform-style:preserve-3d;

    cursor:pointer;

    transition:
        transform 1.45s cubic-bezier(.22,1,.36,1),
        filter .3s ease,
        opacity .45s ease;

    filter:
        drop-shadow(0 12px 12px rgba(0,0,0,.25));

    backface-visibility:visible;
}

.tarjeta-triangular:hover{
    filter:
        drop-shadow(0 18px 18px rgba(0,0,0,.38))
        brightness(1.08);
}

.tarjeta-triangular svg{
    width:100%;
    height:100%;

    display:block;

    overflow:visible;
}


/* =========================================================
   POSICIÓN DE LAS 6 CARAS

   3 ARRIBA
   3 ABAJO

   JUNTAS FORMAN UN SOLO OBJETO
========================================================= */


/* CARA FRONTAL SUPERIOR */

.cara-1{
    transform:
        rotateY(0deg)
        rotateX(28deg)
        translateZ(145px)
        translateY(-58px);
}


/* CARA SUPERIOR DERECHA */

.cara-2{
    transform:
        rotateY(120deg)
        rotateX(28deg)
        translateZ(145px)
        translateY(-58px);
}


/* CARA SUPERIOR IZQUIERDA */

.cara-3{
    transform:
        rotateY(240deg)
        rotateX(28deg)
        translateZ(145px)
        translateY(-58px);
}


/* CARA INFERIOR FRONTAL */

.cara-4{
    transform:
        rotateY(60deg)
        rotateX(-28deg)
        rotateZ(180deg)
        translateZ(145px)
        translateY(-58px);
}


/* CARA INFERIOR DERECHA */

.cara-5{
    transform:
        rotateY(180deg)
        rotateX(-28deg)
        rotateZ(180deg)
        translateZ(145px)
        translateY(-58px);
}


/* CARA INFERIOR IZQUIERDA */

.cara-6{
    transform:
        rotateY(300deg)
        rotateX(-28deg)
        rotateZ(180deg)
        translateZ(145px)
        translateY(-58px);
}


/* =========================================================
   VIDEO DENTRO DEL TRIÁNGULO
========================================================= */

.video-tarjeta{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    pointer-events:none;
}


/* =========================================================
   CENTRO LUMINOSO PARA UNIR VISUALMENTE LAS TARJETAS
========================================================= */

.centro-luz{
    position:absolute;

    left:50%;
    top:50%;

    width:230px;
    height:230px;

    transform:
        translate(-50%, -50%)
        translateZ(0);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95) 0%,
            rgba(124,255,224,.42) 35%,
            rgba(186,115,255,.18) 58%,
            transparent 75%
        );

    filter:blur(15px);

    pointer-events:none;
}


/* =========================================================
   TEXTO DE AYUDA
========================================================= */

.indicacion{
    position:absolute;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    padding:10px 18px;

    color:#222222;

    background:rgba(255,255,255,.85);

    border:1px solid rgba(0,0,0,.08);
    border-radius:30px;

    font-size:14px;
    font-weight:700;

    white-space:nowrap;

    box-shadow:
        0 8px 25px rgba(0,0,0,.12);

    backdrop-filter:blur(8px);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

    .escena-3d{
        width:100vw;
        height:100vh;

        transform:scale(.82);
    }

}


@media(max-width:560px){

    .escena-3d{
        transform:scale(.62);
    }

    .indicacion{
        bottom:-30px;
        font-size:13px;
    }

}


/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;

    z-index:999999;

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.88);

    backdrop-filter:blur(8px);
}

.modal.activo{
    display:flex;
}


/* CAJA PRINCIPAL */

.modal-caja{
    position:relative;

    width:min(1050px, 96vw);
    max-height:92vh;

    display:grid;
    grid-template-columns:1.15fr .85fr;

    overflow:auto;

    background:#ffffff;

    border-radius:22px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.58);
}


/* BOTÓN CERRAR */

.cerrar-modal{
    position:absolute;

    top:12px;
    right:12px;

    z-index:50;

    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    border-radius:50%;

    color:#ffffff;
    background:#111111;

    font-size:28px;

    cursor:pointer;
}


/* =========================================================
   GALERÍA DEL MODAL
========================================================= */

.modal-galeria{
    padding:25px;

    background:#101010;
}

.visual-principal{
    width:100%;
    height:500px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#050505;

    border-radius:16px;
}


/* MOSTRAR IMAGEN O VIDEO COMPLETO */

.visual-principal img,
.visual-principal video{
    width:100%;
    height:100%;

    display:block;

    object-fit:contain;
}


/* MINIATURAS */

.miniaturas{
    display:flex;
    gap:12px;

    margin-top:16px;

    overflow-x:auto;
}

.miniatura{
    position:relative;

    flex:0 0 88px;

    width:88px;
    height:72px;

    overflow:hidden;

    border:3px solid transparent;
    border-radius:10px;

    background:#222222;

    cursor:pointer;
}

.miniatura.activa{
    border-color:#62ffc8;
}

.miniatura img,
.miniatura video{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    pointer-events:none;
}

.icono-video{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%, -50%);

    color:#ffffff;

    font-size:25px;

    text-shadow:
        0 2px 8px #000000;
}


/* =========================================================
   INFORMACIÓN DEL MODAL
========================================================= */

.modal-informacion{
    padding:70px 38px 38px;

    display:flex;
    flex-direction:column;
}

.modal-informacion h2{
    margin-bottom:18px;

    color:#151515;

    font-size:30px;
}

.modal-informacion p{
    margin-bottom:18px;

    color:#4b4b4b;

    font-size:17px;
    line-height:1.65;
}

.precio-modal{
    margin:8px 0 25px;

    color:#111111;

    font-size:28px;
    font-weight:800;
}


/* =========================================================
   BOTÓN WHATSAPP
========================================================= */

.boton-whatsapp{
    width:100%;

    margin-top:auto;
    padding:16px 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ffffff;
    background:#25d366;

    border-radius:12px;

    font-size:18px;
    font-weight:800;

    text-align:center;
    text-decoration:none;

    transition:
        transform .25s ease,
        background .25s ease;
}

.boton-whatsapp:hover{
    background:#1ebe5d;

    transform:translateY(-3px);
}

const objeto3D =

/* =========================================================
   MOVIMIENTO:
   1. LAS TARJETAS GIRAN EN ÓRBITA
   2. SE UNEN CONSERVANDO LA FIGURA TRIANGULAR
   3. LA FIGURA DA UNA VUELTA COMPLETA
   4. REGRESAN A LA ÓRBITA
========================================================= */

const tarjetas3D =
    [...document.querySelectorAll(".tarjeta-triangular")];

const transformacionesFigura = [

    `rotateY(0deg)
     rotateX(28deg)
     translateZ(145px)
     translateY(-58px)`,

    `rotateY(120deg)
     rotateX(28deg)
     translateZ(145px)
     translateY(-58px)`,

    `rotateY(240deg)
     rotateX(28deg)
     translateZ(145px)
     translateY(-58px)`,

    `rotateY(60deg)
     rotateX(-28deg)
     rotateZ(180deg)
     translateZ(145px)
     translateY(-58px)`,

    `rotateY(180deg)
     rotateX(-28deg)
     rotateZ(180deg)
     translateZ(145px)
     translateY(-58px)`,

    `rotateY(300deg)
     rotateX(-28deg)
     rotateZ(180deg)
     translateZ(145px)
     translateY(-58px)`

];


let faseMovimiento =
    "orbita";

let anguloOrbita =
    0;

let cuadroAnimacion =
    null;

let temporizadorFase =
    null;

let ultimoTiempo =
    performance.now();

let movimientoPausado =
    false;

let seMovio =
    false;


/* MEDIDAS RESPONSIVE DE LA ÓRBITA */

function medidasOrbita(){

    const ancho =
        window.innerWidth;

    if(ancho <= 560){

        return {
            radioX:285,
            radioY:112,
            profundidad:185,
            escalaMin:.42,
            escalaMax:.72
        };

    }

    if(ancho <= 800){

        return {
            radioX:320,
            radioY:128,
            profundidad:220,
            escalaMin:.48,
            escalaMax:.80
        };

    }

    return {
        radioX:410,
        radioY:150,
        profundidad:285,
        escalaMin:.50,
        escalaMax:.90
    };

}


/* COLOCAR LAS SEIS TARJETAS EN SU ÓRBITA */

function dibujarOrbita(){

    const medidas =
        medidasOrbita();

    tarjetas3D.forEach(
        (tarjeta, indice) => {

            const angulo =
                anguloOrbita +
                indice * (Math.PI * 2 / tarjetas3D.length);

            const seno =
                Math.sin(angulo);

            const coseno =
                Math.cos(angulo);

            const x =
                coseno * medidas.radioX;

            const y =
                seno * medidas.radioY;

            const z =
                seno * medidas.profundidad;

            const profundidadNormalizada =
                (seno + 1) / 2;

            const escala =
                medidas.escalaMin +
                profundidadNormalizada *
                (medidas.escalaMax - medidas.escalaMin);

            const opacidad =
                .42 +
                profundidadNormalizada * .58;

            tarjeta.style.zIndex =
                String(
                    Math.round(
                        100 + profundidadNormalizada * 100
                    )
                );

            tarjeta.style.opacity =
                opacidad.toFixed(3);

            tarjeta.style.transform =
                `translate3d(${x}px, ${y}px, ${z}px)
                 rotateY(${-coseno * 18}deg)
                 rotateX(${seno * 7}deg)
                 scale(${escala})`;

        }
    );

}


/* ANIMACIÓN CONTINUA DE LA ÓRBITA */

function animarOrbita(tiempo){

    if(
        faseMovimiento !== "orbita" ||
        movimientoPausado
    ){
        cuadroAnimacion =
            requestAnimationFrame(animarOrbita);

        ultimoTiempo =
            tiempo;

        return;
    }

    const delta =
        Math.min(
            40,
            tiempo - ultimoTiempo
        );

    ultimoTiempo =
        tiempo;

    anguloOrbita +=
        delta * .00046;

    dibujarOrbita();

    cuadroAnimacion =
        requestAnimationFrame(animarOrbita);

}


/* UNIR LAS TARJETAS SIN CAMBIAR SU FORMA */

function unirFigura(){

    if(movimientoPausado){
        return;
    }

    faseMovimiento =
        "uniendo";

    objeto3D.classList.remove(
        "en-orbita",
        "girando-figura"
    );

    objeto3D.classList.add(
        "figura-unida"
    );

    objeto3D.style.transform =
        "";

    tarjetas3D.forEach(
        (tarjeta, indice) => {

            tarjeta.style.opacity =
                "1";

            tarjeta.style.zIndex =
                String(20 + indice);

            tarjeta.style.transform =
                transformacionesFigura[indice];

        }
    );

    temporizadorFase =
        setTimeout(
            girarFiguraCompleta,
            1750
        );

}


/* DAR UNA VUELTA COMPLETA A LA FIGURA */

function girarFiguraCompleta(){

    if(movimientoPausado){
        return;
    }

    faseMovimiento =
        "girando";

    objeto3D.classList.remove(
        "figura-unida"
    );

    /* Reinicia correctamente la animación */
    void objeto3D.offsetWidth;

    objeto3D.classList.add(
        "girando-figura"
    );

    temporizadorFase =
        setTimeout(
            regresarALaOrbita,
            8200
        );

}


/* VOLVER A SEPARAR LAS TARJETAS HACIA LA ÓRBITA */

function regresarALaOrbita(){

    if(movimientoPausado){
        return;
    }

    faseMovimiento =
        "regresando";

    objeto3D.classList.remove(
        "girando-figura",
        "figura-unida"
    );

    objeto3D.classList.add(
        "en-orbita"
    );

    objeto3D.style.transform =
        "";

    dibujarOrbita();

    temporizadorFase =
        setTimeout(
            () => {

                faseMovimiento =
                    "orbita";

                ultimoTiempo =
                    performance.now();

                programarUnion();

            },
            1600
        );

}


/* TIEMPO QUE PERMANECEN GIRANDO EN ÓRBITA */

function programarUnion(){

    clearTimeout(
        temporizadorFase
    );

    temporizadorFase =
        setTimeout(
            unirFigura,
            9000
        );

}


/* PAUSAR TODO CUANDO SE ABRE EL MODAL */

function pausarMovimiento(){

    movimientoPausado =
        true;

    clearTimeout(
        temporizadorFase
    );

    objeto3D.style.animationPlayState =
        "paused";

}


/* REANUDAR DESDE LA ÓRBITA AL CERRAR EL MODAL */

function reanudarMovimiento(){

    movimientoPausado =
        false;

    objeto3D.style.animationPlayState =
        "running";

    objeto3D.classList.remove(
        "girando-figura",
        "figura-unida"
    );

    objeto3D.classList.add(
        "en-orbita"
    );

    faseMovimiento =
        "orbita";

    ultimoTiempo =
        performance.now();

    dibujarOrbita();

    programarUnion();

}


/* ARRASTRAR CON MOUSE O DEDO:
   mueve manualmente la órbita sin deformar las tarjetas */

let arrastrando =
    false;

let inicioX =
    0;

let inicioY =
    0;


function iniciarArrastre(evento){

    if(
        modal.classList.contains("activo") ||
        faseMovimiento !== "orbita"
    ){
        return;
    }

    arrastrando =
        true;

    seMovio =
        false;

    const punto =
        evento.touches
            ? evento.touches[0]
            : evento;

    inicioX =
        punto.clientX;

    inicioY =
        punto.clientY;

}


function moverObjeto(evento){

    if(!arrastrando){
        return;
    }

    const punto =
        evento.touches
            ? evento.touches[0]
            : evento;

    const diferenciaX =
        punto.clientX - inicioX;

    const diferenciaY =
        punto.clientY - inicioY;

    if(
        Math.abs(diferenciaX) > 3 ||
        Math.abs(diferenciaY) > 3
    ){
        seMovio =
            true;
    }

    anguloOrbita +=
        diferenciaX * .009;

    objeto3D.style.transform =
        `translateY(${Math.max(-45, Math.min(45, diferenciaY * .35))}px)`;

    dibujarOrbita();

    inicioX =
        punto.clientX;

    inicioY =
        punto.clientY;

}


function terminarArrastre(){

    if(!arrastrando){
        return;
    }

    arrastrando =
        false;

    objeto3D.style.transform =
        "";

}


escena3D.addEventListener(
    "mousedown",
    iniciarArrastre
);

window.addEventListener(
    "mousemove",
    moverObjeto
);

window.addEventListener(
    "mouseup",
    terminarArrastre
);


escena3D.addEventListener(
    "touchstart",
    iniciarArrastre,
    {
        passive:true
    }
);

window.addEventListener(
    "touchmove",
    moverObjeto,
    {
        passive:true
    }
);

window.addEventListener(
    "touchend",
    terminarArrastre
);


/* INICIO DEL CICLO */

objeto3D.classList.add(
    "en-orbita"
);

dibujarOrbita();

cuadroAnimacion =
    requestAnimationFrame(animarOrbita);

programarUnion();


/* =========================================================
   CREAR IMAGEN O VIDEO DEL MODAL
========================================================= */

function crearMedio(
    elemento,
    esMiniatura = false
){

    if(elemento.tipo === "video"){

        const video =
            document.createElement("video");


        video.src =
            elemento.archivo;

        video.playsInline =
            true;

        video.preload =
            "metadata";


        if(esMiniatura){

            video.muted =
                true;

        }else{

            video.controls =
                true;

        }


        return video;

    }


    const imagen =
        document.createElement("img");


    imagen.src =
        elemento.archivo;

    imagen.alt =
        "Imagen del producto";


    return imagen;

}


/* =========================================================
   MOSTRAR ELEMENTO PRINCIPAL
========================================================= */

function mostrarPrincipal(elemento){

    visualPrincipal.innerHTML =
        "";

    const medio =
        crearMedio(
            elemento,
            false
        );

    visualPrincipal.appendChild(
        medio
    );

}


/* =========================================================
   ABRIR MODAL
========================================================= */

function abrirModal(indice){

    const producto =
        productos[indice];


    tituloModal.textContent =
        producto.nombre;


    descripcionModal.textContent =
        producto.descripcion;


    precioModal.textContent =
        producto.precio;


    const mensaje =
        encodeURIComponent(

            `Hola. Me interesa recibir más información sobre ${producto.nombre}. ¿Podría compartir los detalles, disponibilidad y proceso de compra, por favor?`

        );


    botonWhatsApp.href =
        `https://wa.me/523344340062?text=${mensaje}`;


    miniaturas.innerHTML =
        "";


    mostrarPrincipal(
        producto.galeria[0]
    );


    producto.galeria.forEach(

        (elemento, posicion) => {


            const boton =
                document.createElement("button");


            boton.type =
                "button";


            boton.className =
                "miniatura";


            if(posicion === 0){

                boton.classList.add(
                    "activa"
                );

            }


            const medio =
                crearMedio(
                    elemento,
                    true
                );


            boton.appendChild(medio);


            if(elemento.tipo === "video"){

                const icono =
                    document.createElement("span");


                icono.className =
                    "icono-video";


                icono.textContent =
                    "▶";


                boton.appendChild(icono);

            }


            boton.addEventListener(

                "click",

                () => {


                    document
                        .querySelectorAll(".miniatura")
                        .forEach(item => {

                            item.classList.remove(
                                "activa"
                            );

                        });


                    boton.classList.add(
                        "activa"
                    );


                    mostrarPrincipal(
                        elemento
                    );

                }

            );


            miniaturas.appendChild(
                boton
            );

        }

    );


    modal.classList.add(
        "activo"
    );


    document.body.style.overflow =
        "hidden";


    pausarMovimiento();

}


/* =========================================================
   ABRIR LA TARJETA CORRESPONDIENTE
========================================================= */

document
    .querySelectorAll(".tarjeta-triangular")
    .forEach(tarjeta => {


        tarjeta.addEventListener(

            "click",

            evento => {


                evento.stopPropagation();


                if(seMovio){

                    seMovio =
                        false;

                    return;

                }


                const indice =
                    Number(
                        tarjeta.dataset.producto
                    );


                abrirModal(
                    indice
                );

            }

        );

    });


/* =========================================================
   CERRAR MODAL
========================================================= */

function cerrarVentana(){

    modal.classList.remove(
        "activo"
    );


    visualPrincipal.innerHTML =
        "";


    document.body.style.overflow =
        "";


    reanudarMovimiento();

}


cerrarModal.addEventListener(

    "click",

    cerrarVentana

);


modal.addEventListener(

    "click",

    evento => {


        if(evento.target === modal){

            cerrarVentana();

        }

    }

);


document.addEventListener(

    "keydown",

    evento => {


        if(evento.key === "Escape"){

            cerrarVentana();

        }

    }

);

</script>
